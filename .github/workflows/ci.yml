name: CI

on:
  push:
    branches: [ main, master, developer ]
  pull_request:

permissions:
  contents: write

jobs:
  check-licences:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check licences
        run: ./gradlew licensee --stacktrace --info

  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --stacktrace --info

      - name: Run tests
        run: ./gradlew test --stacktrace --info

  # Verify that the freshly built plugin can actually be signed with the signing material
  # currently stored in the repository secrets — so a broken/expired certificate or a wrong
  # password is caught on every push instead of only failing the real release.
  verify-signing:
    runs-on: ubuntu-latest
    # Secrets are not exposed to pull requests coming from forks; only run where they exist.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check signing secrets presence
        id: secrets
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$CERTIFICATE_CHAIN" ] && [ -n "$PRIVATE_KEY" ] && [ -n "$PRIVATE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets (CERTIFICATE_CHAIN / PRIVATE_KEY / PRIVATE_KEY_PASSWORD) not configured — skipping signability check."
          fi

      # Secrets touch the environment only in this trusted printf-only step; the Gradle/signer
      # process below gets just file paths (umask 077 keeps the files private).
      - name: Write signing material
        if: steps.secrets.outputs.available == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE_CHAIN"    > "$RUNNER_TEMP/chain.crt"
          printf '%s' "$PRIVATE_KEY"          > "$RUNNER_TEMP/private.pem"
          printf '%s' "$PRIVATE_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"

      - name: Build and sign the plugin (signability check)
        if: steps.secrets.outputs.available == 'true'
        env:
          PRIVATE_KEY_PASSWORD_FILE: ${{ runner.temp }}/key.pass
          CERTIFICATE_CHAIN_FILE: ${{ runner.temp }}/chain.crt
          PRIVATE_KEY_FILE: ${{ runner.temp }}/private.pem
        run: ./gradlew signPlugin --stacktrace --info

  # Build the docs as a generation test (mkdocs --strict) on every push and PR.
  # No deployment here — that only happens for pushes (see deploy-snapshot-docs).
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build docs
        run: ./gradlew buildDocs --stacktrace --info

  # Publish the docs via mike as the 'snapshot' version on a push to the default
  # branch — without the 'latest' alias, so released versions stay the default.
  # Never runs for pull requests. Tag releases publish their own versioned docs
  # (see release.yml).
  deploy-snapshot-docs:
    runs-on: ubuntu-latest
    needs: validate-docs
    if: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy snapshot docs
        run: ./gradlew deployDocs -Pversion=snapshot -PsetLatest=false --stacktrace --info
