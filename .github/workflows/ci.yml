name: CI

on:
  push:
    branches: [ main, master, developer ]
  pull_request:

permissions:
  contents: write

jobs:
  check-licences:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check licences
        run: ./gradlew licensee --stacktrace --info

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom --stacktrace

  # Build and test are separate concerns and run independently: `assemble` only produces artifacts and
  # contains no verification, so it never re-runs what the test jobs already cover.
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble
        run: ./gradlew assemble --stacktrace --info

  # Developer tests: every test class NOT named *IT. The fast inner-loop suite.
  test-developer:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      # The local composite action can only be resolved once the repo is on disk.
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      # Dedicated task (see the root build.gradle.kts); `test` would run BOTH suites.
      - name: Run developer tests
        run: ./gradlew developerTest --stacktrace --info

      # Uploaded on failure too — that is the case the report is actually needed for. Three sources, because
      # the HTML report alone is not enough to diagnose a failure that only happens on CI:
      #   reports/      the browsable HTML report
      #   test-results/ the JUnit XML, which carries the full stack trace and stdout/stderr per test
      #   sandbox logs  the per-test idea.log under .intellijPlatform/sandbox/<module>/<ide>/log-test/;
      #                 platform tests write their diagnostics there rather than to the console
      #                 (idea.split.test.logs=true, see the module build scripts)
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-developer
          path: |
            **/build/reports/tests/developerTest/**
            **/build/test-results/developerTest/**
            .intellijPlatform/sandbox/*/*/log-test/**
          # An empty artifact would silently hide a broken path; fail loudly instead.
          if-no-files-found: error

  # Integration tests: test classes named *IT — shipped-artifact smoke tests, the timing-based performance
  # guards and the validation against the official Inno Setup example corpus. Runs at the same time as the
  # developer tests, from the identical setup.
  #
  # NETWORK: `integrationTest` depends on :language:script:downloadInnoSetupExamples, which fetches the
  # Examples/ directory of the pinned jrsoftware/issrc tag (see gradle/libs.versions.toml). Those third-party
  # scripts are deliberately not checked in; the run is finalized by cleanInnoSetupExamples, which deletes
  # them again. Only the derived fingerprints in language/script/src/test/resources/examples are committed.
  test-integration:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      # The local composite action can only be resolved once the repo is on disk.
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gradle

      - name: Run integration tests
        run: ./gradlew integrationTest --stacktrace --info

      # Own task, hence its own report and result directories — separate from the developer suite.
      # See the developer job above for what each of the three paths contributes.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-integration
          path: |
            **/build/reports/tests/integrationTest/**
            **/build/test-results/integrationTest/**
            .intellijPlatform/sandbox/*/*/log-test/**
          if-no-files-found: error

  # Single gate name for everything downstream: the pipeline continues only when BOTH suites are green.
  tests:
    runs-on: ubuntu-latest
    needs:
      - test-developer
      - test-integration
    steps:
      - name: Both test suites passed
        run: echo "Developer and integration tests are green."

  # Run the JetBrains Plugin Verifier against the full IDE matrix declared in
  # plugin/build.gradle.kts (IntelliJ IDEA, Rider, CLion, GoLand). The matrix is version-catalog driven,
  # so this job automatically follows a platform bump. See .claude/rules/plugin-verification.md.
  verify-plugin:
    runs-on: ubuntu-latest
    # Gated on the tests: a red suite must stop the pipeline, not merely be reported next to it.
    needs: tests
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-report
          path: '**/build/reports/pluginVerifier/**'

  # Verify that the freshly built plugin can actually be signed with the signing material
  # currently stored in the repository secrets — so a broken/expired certificate or a wrong
  # password is caught on every push instead of only failing the real release.
  verify-signing:
    runs-on: ubuntu-latest
    # Gated on the tests: a red suite must stop the pipeline, not merely be reported next to it.
    needs: tests
    # Secrets are not exposed to pull requests coming from forks; only run where they exist.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check signing secrets presence
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS) not configured — skipping signability check."
          fi

      # Secrets touch the environment only in this trusted printf-only step; the Gradle/signer
      # process below gets just file paths (umask 077 keeps the files private).
      - name: Write signing material
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          printf '%s' "$KEYSTORE_PASSWORD"           > "$RUNNER_TEMP/keystore.pass"

      - name: Build and sign the plugin (signability check)
        if: steps.secrets.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.p12
          KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/keystore.pass
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew signPlugin --stacktrace --info

  # Build the docs as a generation test (mkdocs --strict) on every push and PR.
  # Verification only — the gh-pages site is updated solely by tag releases
  # (see release.yml). No deployment happens from this workflow.
  validate-docs:
    runs-on: ubuntu-latest
    # Gated on the tests, like every other downstream job.
    needs: tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build docs
        run: ./gradlew buildDocs --stacktrace --info
