name: Sign Plugin (manual)

# Manual-only workflow to produce a signed plugin archive for the *first* upload to the
# JetBrains Plugin Marketplace (which has to be done by hand once). Pure build + sign —
# no docs, no licence check, no publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to stamp into the build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  actions: write   # required to delete the artifact again after the download window

jobs:
  sign:
    runs-on: ubuntu-latest
    # Only the repository owner's manual triggers run; anyone else is a no-op.
    if: github.actor == github.repository_owner

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Secrets touch the environment only in this trusted printf-only step; the Gradle/signer
      # process below gets just file paths (umask 077 keeps the files private).
      - name: Write signing material
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$CERTIFICATE_CHAIN"    > "$RUNNER_TEMP/chain.crt"
          printf '%s' "$PRIVATE_KEY"          > "$RUNNER_TEMP/private.pem"
          printf '%s' "$PRIVATE_KEY_PASSWORD" > "$RUNNER_TEMP/key.pass"

      - name: Build and sign the plugin
        env:
          PRIVATE_KEY_PASSWORD_FILE: ${{ runner.temp }}/key.pass
          CERTIFICATE_CHAIN_FILE: ${{ runner.temp }}/chain.crt
          PRIVATE_KEY_FILE: ${{ runner.temp }}/private.pem
        run: ./gradlew signPlugin -Pversion="${{ inputs.version }}" --stacktrace

      # The artifact to upload to the Marketplace is the *-signed.zip; the unsigned zip is
      # included for reference.
      - name: Upload signed plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: inno-setup-${{ inputs.version }}-signed
          path: build/distributions/*.zip
          if-no-files-found: error
          # Safety net: GitHub's minimum retention is 1 day; the cleanup job below removes it
          # within ~10 minutes, this only matters if that job fails to run.
          retention-days: 1

  # Delete the artifact ~10 minutes after the build finished, leaving a short download window.
  cleanup:
    runs-on: ubuntu-latest
    needs: sign
    if: always() && needs.sign.result == 'success'

    steps:
      - name: Wait out the 10-minute download window
        run: sleep 600

      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
