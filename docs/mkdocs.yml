          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            File Types: 파일 형식
            Inno Setup Script: Inno Setup 스크립트
            Script Files: 스크립트 파일
            Sections: 섹션
            Setup: 설정
            Types: 타입
            Components: 컴포넌트
            Tasks: 작업
            Dirs: 디렉토리
            Files: 파일
            Icons: 아이콘
            Registry: 레지스트리
            Run: 실행
            UninstallRun: 제거 실행
