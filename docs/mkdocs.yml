extra:
  version:
    provider: mike
    alias: true

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
#  - pymdownx.snippets
#  - pymdownx.highlight

theme:
  name: material
  language: en
  logo: assets/images/inno-setup-icon.png
  features:
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - File Types: file-types.md
  - Inno Setup Script:
      - Script Files: script-files.md
      - Sections:
          - Setup: sections/setup.md
          - Types: sections/types.md
          - Components: sections/components.md
          - Tasks: sections/tasks.md
          - Dirs: sections/dirs.md
          - Files: sections/files.md
          - Icons: sections/icons.md
          - INI: sections/ini.md
          - Registry: sections/registry.md
          - Run: sections/run.md
          - UninstallRun: sections/uninstall-run.md
          - Languages: sections/languages.md
          - LangOptions: sections/langoptions.md
          - Messages: sections/messages.md
          - CustomMessages: sections/custom-messages.md
          - InstallDelete: sections/install-delete.md
          - UninstallDelete: sections/uninstall-delete.md
          - ISSigKeys: sections/issigkeys.md
          - Code: sections/code.md
  - Inno Setup Language:
      - Language Files: language-files.md
      - Sections:
          - LangOptions: sections/langoptions.md
          - Messages: sections/messages.md
          - CustomMessages: sections/custom-messages.md
  - Inno Setup Template:
      - Template Files: template-files.md
  - Inno Setup Preprocessor:
      - Overview: preprocessor/overview.md
      - Directives:
        - "#define": preprocessor/define.md
        - "#undef": preprocessor/undef.md
        - "#dim / #redim": preprocessor/arrays.md
        - "#include / #file": preprocessor/include.md
        - "#emit / #expr / #insert / #append": preprocessor/output.md
        - "#if / #ifdef / …": preprocessor/conditionals.md
        - "#for": preprocessor/for.md
        - "#sub / #endsub": preprocessor/sub.md
        - "#pragma": preprocessor/pragma.md
        - "#error": preprocessor/error.md
  - Build Integration: build.md
  - Run Configuration: run-configuration.md
  - Structure View: structure-view.md
  - Settings:
      - General: settings.md
      - Editor: settings-editor.md
      - Code Style: settings-code-style.md
      - Build: settings-build.md
  - API Docs: dokka/html/index.html
  - Licences:
      - Overview: licensing.md
      - Dependencies: licences/index.html
