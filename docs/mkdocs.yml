site_name: Inno Setup – JetBrains Plugin
site_description: JetBrains plugin providing language support for Inno Setup scripts (.iss) in all IntelliJ-platform IDEs
site_author: PCSoft

docs_dir: docs

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 主页
            File Types: 文件类型
            Inno Setup Script: Inno Setup 脚本
            Script Files: 脚本文件
            Sections: 节
            Setup: 设置
            Types: 类型
            Components: 组件
            Tasks: 任务
            Dirs: 目录
            Files: 文件
            Icons: 图标
            Registry: 注册表
            Run: 运行
            UninstallRun: 卸载运行
            Languages: 语言
            LangOptions: 语言选项
            Messages: 消息
            CustomMessages: 自定义消息
            InstallDelete: 安装删除
            UninstallDelete: 卸载删除
            ISSigKeys: ISSig 密钥
            Code: 代码
            Inno Setup Language: Inno Setup 语言文件
            Language Files: 语言文件
            Build Integration: 构建集成
            Structure View: 结构视图
            Settings: 设置
            General: 常规
            Build: 构建
            API Docs: API 文档
            Licences: 许可证
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            File Types: ファイルタイプ
            Inno Setup Script: Inno Setup スクリプト
            Script Files: スクリプトファイル
            Sections: セクション
            Setup: セットアップ
            Types: タイプ
            Components: コンポーネント
            Tasks: タスク
            Dirs: ディレクトリ
            Files: ファイル
            Icons: アイコン
            Registry: レジストリ
            Run: 実行
            UninstallRun: アンインストール実行
            Languages: 言語
            LangOptions: 言語オプション
            Messages: メッセージ
            CustomMessages: カスタムメッセージ
            InstallDelete: インストール削除
            UninstallDelete: アンインストール削除
            ISSigKeys: ISSig キー
            Code: コード
            Inno Setup Language: Inno Setup 言語ファイル
            Language Files: 言語ファイル
