site_name: Inno Setup – JetBrains Plugin
site_description: JetBrains plugin providing language support for Inno Setup scripts (.iss) in all IntelliJ-platform IDEs
site_author: PCSoft

docs_dir: docs

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - toc:
      toc_depth: 3
#  - pymdownx.snippets
#  - pymdownx.highlight

theme:
  name: material
  language: en
  logo: assets/images/inno-setup-icon.png
  features:
    - navigation.sections
  palette:
    - scheme: default
      primary: custom
      accent: custom

nav:
  - Home: index.md
  - File Types: file-types.md
  - Inno Setup Script:
      - Script Files: script-files.md
      - Sections:
          - Setup: sections/setup.md
          - Types: sections/types.md
          - Components: sections/components.md
          - Tasks: sections/tasks.md
          - Dirs: sections/dirs.md
          - Files: sections/files.md
          - Icons: sections/icons.md
          - INI: sections/ini.md
          - Registry: sections/registry.md
          - Run: sections/run.md
          - UninstallRun: sections/uninstall-run.md
          - Languages: sections/languages.md
          - LangOptions: sections/langoptions.md
          - Messages: sections/messages.md
          - CustomMessages: sections/custom-messages.md
          - InstallDelete: sections/install-delete.md
          - UninstallDelete: sections/uninstall-delete.md
          - ISSigKeys: sections/issigkeys.md
          - Code: sections/code.md
  - Inno Setup Language:
      - Language Files: language-files.md
      - Sections:
          - LangOptions: sections/langoptions.md
          - Messages: sections/messages.md
          - CustomMessages: sections/custom-messages.md
  - Build Integration: build.md
  - Structure View: structure-view.md
  - Settings:
      - General: settings.md
      - Build: settings-build.md
  - API Docs: dokka/html/index.html
  - Licences: licences/index.html
