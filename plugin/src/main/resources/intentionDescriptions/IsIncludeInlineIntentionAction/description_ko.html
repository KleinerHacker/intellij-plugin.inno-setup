<code>#include "file"</code> 줄을 포함된 파일의 내용 그대로 대체합니다.
<!-- tooltip end -->
<p>
    캐럿이 <code>#include</code> 줄에 있고 해당 경로가 (포함하는 스크립트의 디렉터리를 기준으로)
    기존 파일로 확인될 때 사용할 수 있습니다. 한 단계만 인라인되며, 삽입된 텍스트 안의 중첩된
    <code>#include</code> 줄은 그대로 유지됩니다. 인라인 후 더 이상 사용되지 않는 include 파일을
    삭제할지 묻습니다.
</p>
