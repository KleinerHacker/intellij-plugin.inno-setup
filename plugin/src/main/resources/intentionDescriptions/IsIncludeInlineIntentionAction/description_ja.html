<code>#include "file"</code> 行を、インクルードされたファイルの内容そのものに置き換えます。
<!-- tooltip end -->
<p>
    キャレットが <code>#include</code> 行上にあり、そのパスが（インクルード元スクリプトの
    ディレクトリを基準に）既存のファイルに解決される場合に使用できます。インライン化は 1 階層のみで、
    挿入されたテキスト内のネストした <code>#include</code> 行はそのまま残ります。インライン化後、
    不要になったインクルードファイルを削除するかどうかを確認します。
</p>
