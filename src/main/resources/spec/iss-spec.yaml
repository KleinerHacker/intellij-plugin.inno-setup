        required: false
        deprecated: false
        description: "Command-line arguments passed to <code>Filename</code>."
        array: false

      - name: WorkingDir
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Working directory for the process. Defaults to the directory of <code>Filename</code>."
        array: false

      - name: StatusMsg
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Status message shown in the progress window while this entry executes."
        array: false

      - name: RunOnceId
