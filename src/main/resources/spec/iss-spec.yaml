      - name: Verb
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shell verb used with the <code>shellexec</code> flag, e.g. <code>open</code>, <code>print</code>."
        array: false

      - name: OnLog
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure called for each output line (requires <code>logoutput</code> flag)."
        array: false

      - name: Flags
        type:
          kind: flags
          flags:
            - name: postinstall
              description: "Shows a checkbox on the final wizard page letting the user choose whether to run this entry after uninstallation."
              deprecated: false
              conflicts: []
            - name: shellexec
              description: "Uses the Windows shell to open the file instead of executing it directly. Required for non-executable files."
              deprecated: false
              conflicts: []
            - name: nowait
              description: "Does not wait for the process to finish before proceeding. Mutually exclusive with <code>waituntilterminated</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: waituntilterminated
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: runhidden
              description: "Runs the process with a hidden window. Has no effect when combined with <code>shellexec</code>."
              deprecated: false
              conflicts:
                - flag: shellexec
                  severity: warning
            - name: skipifsilent
              description: "Skips this entry when the uninstaller is run silently. Mutually exclusive with <code>skipifnotsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifnotsilent
                  severity: error
            - name: skipifnotsilent
              description: "Skips this entry when the uninstaller is run non-silently. Mutually exclusive with <code>skipifsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifsilent
                  severity: error
            - name: unchecked
              description: "The checkbox added by <code>postinstall</code> is unchecked by default."
              deprecated: false
              conflicts: []
            - name: waituntilterminated
              description: "Waits until the process terminates before proceeding. This is the default behaviour. Mutually exclusive with <code>nowait</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: waituntilidle
              description: "Waits until the process is idle (no input pending) before proceeding. Mutually exclusive with <code>nowait</code> and <code>waituntilterminated</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilterminated
                  severity: error
            - name: logoutput
              description: "Captures the process output and writes it to the uninstall log. Combining with <code>nowait</code> means output may be incomplete."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: warning
            - name: runasoriginaluser
              description: "Runs the process as the user who launched the uninstaller, not as the elevated user."
              deprecated: false
              conflicts: []
        required: false
        deprecated: false
        description: "Behavioural flags controlling how and when the program is executed during uninstallation."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

      - name: Tasks
        type:
          kind: reference
          section: Tasks
        required: false
        deprecated: false
        description: "Space-separated list of task names. This entry is processed only when at least one listed task is checked."
        array: true

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names. Limits this entry to the specified languages."
        array: true

      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: BeforeInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately before this entry is processed."
        array: false

      - name: AfterInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately after this entry is processed."
        array: false

      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version for which this entry applies. Use <code>0</code> to never apply."
        array: false

      - name: OnlyBelowVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Maximum Windows version (exclusive) for which this entry applies. Use <code>0</code> for no upper limit."
        array: false

  # ---------------------------------------------------------------------------
  # [Languages] — parameter section
  # ---------------------------------------------------------------------------
  - name: Languages
    type: parameter
    deprecated: false
    description: "Declares the languages available in the installer. Each entry points to an ISL message file. The first entry becomes the default language."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Internal language identifier, e.g. <code>english</code>, <code>german</code>. Referenced by the <code>Languages</code> common parameter."
        array: false

      - name: MessagesFile
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Path to the ISL message file. Use <code>compiler:Default.isl</code> for the built-in English messages or <code>compiler:Languages\\German.isl</code> for bundled translations."
        array: false

  # ---------------------------------------------------------------------------
  # [InstallDelete] — parameter section
  # ---------------------------------------------------------------------------
  - name: InstallDelete
    type: parameter
    deprecated: false
    description: "Deletes files or directories at the beginning of installation, before any files are copied. Useful for removing stale files from previous versions."
    attributes:

      - name: Type
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "What to delete: <code>files</code> (matching files), <code>filesandordirs</code> (files and subdirectories), <code>dirifempty</code> (directory only if empty)."
        array: false

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Path or wildcard pattern of the file/directory to delete, e.g. <code>{app}\\*.log</code> or <code>{app}\\cache</code>."
        array: false

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

