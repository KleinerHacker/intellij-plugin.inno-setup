sections:

  # ---------------------------------------------------------------------------
  # [Setup] — directive section
  # ---------------------------------------------------------------------------
  - name: Setup
    type: directive
    required: true
    deprecated: false
    description: "Defines compiler settings and installer behaviour. Every script must contain this section. <b>AppName</b> and <b>AppVersion</b> are the only required directives."
    attributes:

      # --- Required ---
      - name: AppName
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "The full name of the application, e.g. <code>My Program</code>. Displayed throughout the wizard and in Add/Remove Programs."
        array: false

      - name: AppVersion
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "The version string of the application, e.g. <code>1.0</code>. Shown in Add/Remove Programs and used for upgrade detection."
        array: false

      # --- Compiler directives ---
      - name: Compression
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Compression algorithm for setup files. Valid values: <code>lzma2/ultra64</code> (default, best ratio), <code>bzip2</code>, <code>deflate</code>, <code>none</code>."
        array: false

      - name: OutputDir
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Directory where the compiled Setup EXE is written. Relative to the script file location. Default: <code>Output</code>."
        array: false

      - name: OutputBaseFilename
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Base filename (without <code>.exe</code>) of the compiled installer, e.g. <code>myapp-setup</code>. Default: <code>setup</code>."
        array: false

      - name: SourceDir
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Base directory for relative paths used in <code>[Files]</code> and other sections. Defaults to the directory containing the script."
        array: false

      - name: SetupIconFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to an <code>.ico</code> file used as the icon for the compiled Setup EXE."
        array: false

      - name: EncryptionKey
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Password used to encrypt the setup's files. The installer will prompt for this password at runtime."
        array: false

      # --- Publisher / URLs ---
      - name: AppPublisher
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Publisher name shown in Add/Remove Programs."
        array: false

      - name: AppPublisherURL
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "URL of the publisher's website, shown in Add/Remove Programs."
        array: false

      - name: AppSupportURL
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Support URL shown in Add/Remove Programs."
        array: false

      - name: AppUpdatesURL
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Updates/download URL shown in Add/Remove Programs."
        array: false

      # --- Install paths ---
      - name: DefaultDirName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Default installation directory shown on the Select Destination page, e.g. <code>{autopf}\\MyApp</code>. Supports Inno Setup directory constants."
        array: false

      - name: DefaultGroupName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Default Start Menu folder name shown on the Select Start Menu Folder page."
        array: false

      # --- Privileges ---
      - name: PrivilegesRequired
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Required privilege level. Valid values: <code>admin</code> (default), <code>lowest</code>, <code>none</code>."
        array: false

      - name: PrivilegesRequiredOverridesAllowed
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Allows the user to override the privilege requirement. Values: <code>commandline</code>, <code>dialog</code>."
        array: false

      # --- Version constraints ---
      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version required to run the installer, e.g. <code>6.1</code> for Windows 7. Use <code>0</code> to never install."
        array: false

      - name: ArchitecturesAllowed
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Space-separated list of allowed CPU architectures: <code>x86</code>, <code>x64</code>, <code>arm64</code>, <code>ia64</code>. Default: all."
        array: true

      - name: ArchitecturesInstallIn64BitMode
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Architectures for which the installer runs in 64-bit mode, e.g. <code>x64compatible arm64</code>."
        array: true

      # --- Runtime behaviour ---
      - name: AppMutex
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Mutex name checked before installation starts. If the mutex exists, the installer warns that the application is already running."
        array: false

      - name: CloseApplications
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the installer automatically closes applications that lock files being updated."
        array: false

      - name: LicenseFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a <code>.txt</code> or <code>.rtf</code> license file shown on the License Agreement page."
        array: false

      - name: InfoBeforeFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a <code>.txt</code> or <code>.rtf</code> file shown on an information page before installation begins."
        array: false

      - name: InfoAfterFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a <code>.txt</code> or <code>.rtf</code> file shown on an information page after installation completes."
        array: false

      # --- Uninstall ---
      - name: AllowNoIcons
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, a <i>Don't create a Start Menu folder</i> checkbox is shown on the Select Start Menu Folder page."
        array: false

      - name: UninstallDisplayName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name shown for the application in Add/Remove Programs. Defaults to <code>AppName</code>."
        array: false

      - name: UninstallDisplayIcon
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to an EXE, DLL, or ICO used as the icon in Add/Remove Programs, e.g. <code>{app}\\MyApp.exe</code>."
        array: false

      - name: CreateUninstallRegKey
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "Controls whether the uninstall registry key is created under <code>HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall</code>. Default: <code>yes</code>."
        array: false

      - name: Uninstallable
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Pascal expression or <code>yes</code>/<code>no</code> controlling whether an uninstaller entry is created. Default: <code>yes</code>."
        array: false

      # --- Wizard pages ---
      - name: DisableDirPage
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Controls the Select Destination Directory page visibility. Values: <code>yes</code>, <code>no</code>, <code>auto</code> (default)."
        array: false

      - name: DisableProgramGroupPage
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Controls the Select Start Menu Folder page visibility. Values: <code>yes</code>, <code>no</code>, <code>auto</code> (default)."
        array: false

      - name: DisableWelcomePage
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the Welcome page is not shown. Default: <code>no</code>."
        array: false

      - name: DisableReadyPage
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the Ready to Install page is not shown. Default: <code>no</code>."
        array: false

      - name: UsePreviousAppDir
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the previously installed directory is pre-filled on reinstall. Default: <code>yes</code>."
        array: false

      - name: UsePreviousGroup
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the previously used Start Menu folder is pre-filled on reinstall. Default: <code>yes</code>."
        array: false

      - name: UserInfoPage
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, a page is shown asking for the user name, company name, and optional serial number."
        array: false

      # --- Cosmetic ---
      - name: WizardStyle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Visual style of the wizard. Values: <code>classic</code>, <code>modern</code> (default)."
        array: false

      - name: WizardResizable
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, the wizard window can be resized by the user."
        array: false

      - name: WizardImageFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a BMP file displayed on the left side of the wizard in classic style."
        array: false

      - name: WizardSmallImageFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a BMP file displayed in the top-right corner of the wizard."
        array: false

      - name: SetupLogging
        type:
          kind: native
          dataType: boolean
        required: false
        deprecated: false
        description: "If <code>yes</code>, a log file is automatically created in the user's temp directory during installation."
        array: false

  # ---------------------------------------------------------------------------
  # [Types] — parameter section
  # ---------------------------------------------------------------------------
  - name: Types
    type: parameter
    deprecated: false
    description: "Defines named installation profiles (e.g. <i>Full</i>, <i>Compact</i>, <i>Custom</i>) shown in the wizard. Referenced by <code>[Components]</code> entries."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Internal identifier for this installation type. Referenced by the <code>Types</code> parameter in <code>[Components]</code>."
        array: false

      - name: Description
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Human-readable label displayed in the wizard for this installation type."
        array: false

      - name: Flags
        type:
          kind: flags
          flags:
            - name: iscustom
              description: "Marks this installation type as the user-customisable type. Only one type with this flag is allowed per script. When selected, the user can manually choose which components to install."
              deprecated: false
              conflicts: []
        required: false
        deprecated: false
        description: "Behavioural flags controlling the installation type behaviour."
        array: true

  # ---------------------------------------------------------------------------
  # [Components] — parameter section
  # ---------------------------------------------------------------------------
  - name: Components
    type: parameter
    deprecated: false
    description: "Defines selectable installation features shown in the wizard. Supports a backslash hierarchy for parent/child grouping, e.g. <code>main\\help</code>."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Internal identifier for this component. Use backslash for hierarchy, e.g. <code>extra\\plugins</code>."
        array: false

      - name: Description
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Label shown for this component in the wizard's component list."
        array: false

      - name: Types
        type:
          kind: reference
          section: Types
        required: false
        deprecated: false
        description: "Space-separated list of installation type names (from <code>[Types]</code>) that include this component by default."
        array: true

      - name: ExtraDiskSpaceRequired
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Additional disk space in bytes required by this component, beyond the files it installs. Shown on the Select Components page."
        array: false

      - name: Flags
        type:
          kind: flags
          flags:
            - name: fixed
              description: "The component is always installed and cannot be deselected by the user."
              deprecated: false
              conflicts: []
            - name: checkablealone
              description: "Allows the component to be checked even when its parent component is unchecked."
              deprecated: false
              conflicts: []
            - name: exclusive
              description: "Only one component in the group with this flag can be selected at a time (radio-button behaviour)."
              deprecated: false
              conflicts: []
            - name: restart
              description: "The installer will prompt the user to restart the computer if this component is installed."
              deprecated: false
              conflicts: []
            - name: dontinheritcheck
              description: "Prevents the component from inheriting its checked state from its parent component."
              deprecated: false
              conflicts: []
            - name: disablenouninstallwarning
              description: "Suppresses the warning shown when the user deselects a previously installed component."
              deprecated: false
              conflicts: []
        required: false
        deprecated: false
        description: "Behavioural flags controlling component selection and installation behaviour."
        array: true

      # Common parameters
      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names (from <code>[Languages]</code>). Limits this entry to the specified languages."
        array: true

  # ---------------------------------------------------------------------------
  # [Tasks] — parameter section
  # ---------------------------------------------------------------------------
  - name: Tasks
    type: parameter
    deprecated: false
    description: "Defines checkboxes and radio buttons shown on the Select Additional Tasks wizard page. Entries in other sections are linked via their <code>Tasks</code> parameter."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Internal identifier for this task. Use backslash for sub-tasks, e.g. <code>desktopicon\\user</code>."
        array: false

      - name: Description
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Label shown next to the checkbox or radio button in the wizard."
        array: false

      - name: GroupDescription
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Optional heading text displayed above a group of tasks."
        array: false

      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names (from <code>[Components]</code>). This task is only shown when at least one listed component is selected."
        array: true

      - name: Flags
        type:
          kind: flags
          flags:
            - name: checkablealone
              description: "Allows this task to be checked even when its parent task is unchecked."
              deprecated: false
              conflicts: []
            - name: checkedonce
              description: "The task is checked by default only on the first install. On reinstalls it retains the previously chosen state."
              deprecated: false
              conflicts: []
            - name: dontinheritcheck
              description: "Prevents this task from inheriting its checked state from its parent task."
              deprecated: false
              conflicts: []
            - name: exclusive
              description: "Only one task in the group with this flag can be selected at a time (radio-button behaviour)."
              deprecated: false
              conflicts: []
            - name: restart
              description: "The installer will prompt the user to restart the computer if this task is selected."
              deprecated: false
              conflicts: []
            - name: unchecked
              description: "The task is unchecked by default."
              deprecated: false
              conflicts: []
        required: false
        deprecated: false
        description: "Behavioural flags controlling task selection behaviour."
        array: true

      # Common parameters
      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names (from <code>[Languages]</code>). Limits this entry to the specified languages."
        array: true

  # ---------------------------------------------------------------------------
  # [Dirs] — parameter section
  # ---------------------------------------------------------------------------
  - name: Dirs
    type: parameter
    deprecated: false
    description: "Creates additional directories during installation. Primarily useful for empty directories; directories needed by <code>[Files]</code> are created automatically."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Full path of the directory to create, e.g. <code>{app}\\data</code>. Supports all Inno Setup directory constants."
        array: false

      - name: Attribs
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "File system attributes to set on the directory: <code>readonly</code>, <code>hidden</code>, <code>system</code>, <code>notcontentindexed</code>."
        array: true

      - name: Permissions
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "ACL permissions to grant, e.g. <code>users-modify</code>, <code>everyone-readexec</code>. Avoid setting ACLs on top-level system directories."
        array: true

      - name: Flags
        type:
          kind: flags
          flags:
            - name: deleteafterinstall
              description: "Deletes the directory after the installation is complete. Useful for temporary directories created during install."
              deprecated: false
              conflicts: []
            - name: setntfscompression
              description: "Sets NTFS compression on the directory."
              deprecated: false
              conflicts:
                - flag: unsetntfscompression
                  severity: error
            - name: uninsalwaysuninstall
              description: "Always removes this directory on uninstall, even if it is not empty."
              deprecated: false
              conflicts:
                - flag: uninsneveruninstall
                  severity: error
            - name: uninsneveruninstall
              description: "Never removes this directory on uninstall."
              deprecated: false
              conflicts:
                - flag: uninsalwaysuninstall
                  severity: error
            - name: unsetntfscompression
              description: "Removes NTFS compression from the directory."
              deprecated: false
              conflicts:
                - flag: setntfscompression
                  severity: error
        required: false
        deprecated: false
        description: "Behavioural flags controlling directory creation and removal."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

      - name: Tasks
        type:
          kind: reference
          section: Tasks
        required: false
        deprecated: false
        description: "Space-separated list of task names. This entry is processed only when at least one listed task is checked."
        array: true

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names. Limits this entry to the specified languages."
        array: true

      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: BeforeInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately before this entry is processed."
        array: false

      - name: AfterInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately after this entry is processed."
        array: false

      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version for which this entry applies. Use <code>0</code> to never apply."
        array: false

      - name: OnlyBelowVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Maximum Windows version (exclusive) for which this entry applies. Use <code>0</code> for no upper limit."
        array: false

  # ---------------------------------------------------------------------------
  # [Files] — parameter section
  # ---------------------------------------------------------------------------
  - name: Files
    type: parameter
    deprecated: false
    description: "Specifies files to be installed. Wildcards and recursive directory copying are supported. This is the primary section for bundling application files."
    attributes:

      - name: Source
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Source file path or wildcard pattern, e.g. <code>MyProg.exe</code> or <code>Plugins\\*</code>. Relative to <code>SourceDir</code>."
        array: false

      - name: DestDir
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Destination directory on the target machine, e.g. <code>{app}</code> or <code>{sys}</code>. Supports all Inno Setup constants."
        array: false

      - name: DestName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Rename the file when installing. If omitted, the original filename is kept."
        array: false

      - name: Excludes
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Comma-separated list of filename patterns to exclude when using wildcards, e.g. <code>*.pdb,*.log</code>."
        array: false

      - name: ExternalSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Size in bytes of an external file (used with <code>external</code> flag) for accurate disk-space calculation."
        array: false

      - name: Attribs
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "File attributes to set after installation: <code>readonly</code>, <code>hidden</code>, <code>system</code>, <code>notcontentindexed</code>."
        array: true

      - name: Permissions
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "ACL permissions, e.g. <code>users-modify</code>, <code>everyone-readexec</code>."
        array: true

      - name: FontInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Registry font name used when installing a font file, e.g. <code>My Font (TrueType)</code>. Triggers font registration."
        array: false

      - name: StrongAssemblyName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: ".NET strong assembly name for GAC registration."
        array: false

      - name: Hash
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Expected SHA-256 hash of the source file for integrity verification at compile time."
        array: false

      - name: ISSigAllowedKeys
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Comma-separated list of key identifiers from <code>[ISSigKeys]</code> used to verify the file's <code>.issig</code> signature."
        array: true

      - name: ExtractArchivePassword
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Password for an encrypted archive (used with <code>extractarchive</code> flag). Stored unencrypted in the installer."
        array: false

      - name: DownloadISSigSource
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "URL of the <code>.issig</code> signature file for a downloaded file."
        array: false

      - name: DownloadUserName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "HTTP Basic Auth username for authenticated file downloads (used with <code>download</code> flag)."
        array: false

      - name: DownloadPassword
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "HTTP Basic Auth password for authenticated file downloads (used with <code>download</code> flag)."
        array: false

      - name: Flags
        type:
          kind: flags
          flags:
            - name: 32bit
              description: "Treats the file as a 32-bit resource. On 64-bit Windows, file-system and registry redirections apply. Mutually exclusive with <code>64bit</code>."
              deprecated: false
              conflicts:
                - flag: 64bit
                  severity: error
            - name: 64bit
              description: "Treats the file as a 64-bit resource. On 32-bit Windows this flag is silently ignored. Mutually exclusive with <code>32bit</code>."
              deprecated: false
              conflicts:
                - flag: 32bit
                  severity: error
            - name: comparetimestamp
              description: "Installs the file only if it is newer (by timestamp) than the existing file on disk."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: confirmoverwrite
              description: "Always asks the user for confirmation before overwriting an existing file."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: deleteafterinstall
              description: "Deletes the file after installation completes. Useful for temporary files. Cannot be combined with <code>restartreplace</code> or <code>sharedfile</code>."
              deprecated: false
              conflicts:
                - flag: restartreplace
                  severity: error
                - flag: sharedfile
                  severity: error
            - name: dontcopy
              description: "Prevents the file from being copied to disk. The file is still compressed into the installer and can be extracted via <code>[Code]</code>."
              deprecated: false
              conflicts: []
            - name: download
              description: "Downloads the file from a URL at install time instead of embedding it. Requires the URL to be specified in <code>Source</code>."
              deprecated: false
              conflicts: []
            - name: external
              description: "The file is not embedded in the installer but must be present alongside it. Use <code>ExternalSize</code> to specify its size."
              deprecated: false
              conflicts: []
            - name: extractarchive
              description: "Extracts the contents of an archive (zip, 7z, etc.) instead of copying the archive file itself."
              deprecated: false
              conflicts: []
            - name: ignoreversion
              description: "Does not compare version numbers; always installs the file regardless of the version on disk."
              deprecated: false
              conflicts:
                - flag: comparetimestamp
                  severity: warning
                - flag: confirmoverwrite
                  severity: warning
            - name: isreadme
              description: "Marks this file as the README. The installer may offer to open it after installation."
              deprecated: false
              conflicts: []
            - name: nocompression
              description: "Stores this file uncompressed in the installer, even if compression is enabled globally."
              deprecated: false
              conflicts: []
            - name: onlyifdoesntexist
              description: "Only installs the file if it does not already exist on the target machine."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: recursesubdirs
              description: "When <code>Source</code> contains a wildcard, also searches subdirectories recursively."
              deprecated: false
              conflicts: []
            - name: createallsubdirs
              description: "Creates all subdirectories found when using <code>recursesubdirs</code>, even if they are empty."
              deprecated: false
              conflicts: []
            - name: regserver
              description: "Registers the file as a COM server by calling <code>DllRegisterServer</code>."
              deprecated: false
              conflicts:
                - flag: regtypelib
                  severity: warning
            - name: regtypelib
              description: "Registers the file as a type library."
              deprecated: false
              conflicts:
                - flag: regserver
                  severity: warning
            - name: restartreplace
              description: "If the file is in use, schedules it to be replaced on the next system restart."
              deprecated: false
              conflicts:
                - flag: deleteafterinstall
                  severity: error
            - name: sharedfile
              description: "Registers the file as a shared file. The file is only removed on uninstall when no other application references it."
              deprecated: false
              conflicts:
                - flag: deleteafterinstall
                  severity: error
        required: false
        deprecated: false
        description: "Behavioural flags controlling how each file is installed."
        array: true

