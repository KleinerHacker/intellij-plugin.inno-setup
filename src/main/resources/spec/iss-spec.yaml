        deprecated: false
        description: "Shell verb used with the <code>shellexec</code> flag, e.g. <code>open</code>, <code>print</code>."
        array: false

      - name: OnLog
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure called for each output line (requires <code>logoutput</code> flag)."
        array: false

      - name: Flags
        type:
          kind: flags
          flags:
            - name: postinstall
              description: "Shows a checkbox on the final wizard page letting the user choose whether to run this entry after installation."
              deprecated: false
              conflicts: []
            - name: shellexec
              description: "Uses the Windows shell to open the file instead of executing it directly. Required for non-executable files."
              deprecated: false
              conflicts: []
            - name: nowait
              description: "Does not wait for the process to finish before proceeding. Mutually exclusive with <code>waituntilterminated</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: waituntilterminated
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: runhidden
              description: "Runs the process with a hidden window. Has no effect when combined with <code>shellexec</code>."
              deprecated: false
              conflicts:
                - flag: shellexec
                  severity: warning
            - name: skipifsilent
              description: "Skips this entry when the installer is run silently. Mutually exclusive with <code>skipifnotsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifnotsilent
                  severity: error
            - name: skipifnotsilent
              description: "Skips this entry when the installer is run non-silently. Mutually exclusive with <code>skipifsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifsilent
                  severity: error
            - name: unchecked
              description: "The checkbox added by <code>postinstall</code> is unchecked by default."
              deprecated: false
              conflicts: []
            - name: waituntilterminated
              description: "Waits until the process terminates before proceeding. This is the default behaviour. Mutually exclusive with <code>nowait</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: waituntilidle
              description: "Waits until the process is idle (no input pending) before proceeding. Mutually exclusive with <code>nowait</code> and <code>waituntilterminated</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilterminated
                  severity: error
            - name: logoutput
              description: "Captures the process output and writes it to the setup log. Combining with <code>nowait</code> means output may be incomplete."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: warning
            - name: runasoriginaluser
              description: "Runs the process as the user who launched the installer, not as the elevated user. Only relevant when running with elevated privileges."
              deprecated: false
              conflicts: []
        required: false
        deprecated: false
        description: "Behavioural flags controlling how and when the program is executed."
        array: true

