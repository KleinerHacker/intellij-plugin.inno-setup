  # ---------------------------------------------------------------------------
  # [ISSigKeys] — parameter section (IS 6.5+)
  # ---------------------------------------------------------------------------
  - name: ISSigKeys
    type: parameter
    deprecated: false
    description: "Defines cryptographic public keys used to verify <code>.issig</code> file signatures (see <code>issigverify</code> flag in <code>[Files]</code>)."
    since: "6.5"
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Identifier for this key entry, referenced by <code>ISSigAllowedKeys</code> in <code>[Files]</code>."
        array: false

      - name: Group
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Logical group name allowing multiple keys to share an identifier in <code>ISSigAllowedKeys</code>."
        array: false

      - name: KeyFile
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to a key file containing public key data."
        array: false

      - name: PublicX
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Hex-encoded X coordinate of the public EC key."
        array: false

      - name: PublicY
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Hex-encoded Y coordinate of the public EC key."
        array: false

      - name: KeyID
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Optional compile-time key identifier embedded in the installer for key lookup."
        array: false

      - name: RuntimeID
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Optional runtime key identifier used by the installer at install time for key lookup."
        array: false

  # ---------------------------------------------------------------------------
  # [Code] — code section
  # ---------------------------------------------------------------------------
  - name: Code
    type: code
    deprecated: false
    description: "Contains Pascal Script (RemObjects Pascal Script) for runtime customisation of the installer. Unlike other sections, this section does not use Key=Value or Key: Value syntax — it contains free-form Pascal source code compiled and executed by the installer at runtime."
    attributes: [ ]
