  # ---------------------------------------------------------------------------
  # [Run] — parameter section
  # ---------------------------------------------------------------------------
  - name: Run
    type: parameter
    deprecated: false
    description: "Executes programs or opens files after a successful installation, before the final wizard page. Entries run sequentially."
    attributes:

      - name: Filename
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Path to the executable, document, or folder to launch. Use <code>shellexec</code> flag to open non-executables."
        array: false

      - name: Description
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Label for an optional checkbox shown on the post-install page (requires <code>postinstall</code> flag)."
        array: false

      - name: Parameters
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Command-line arguments passed to <code>Filename</code>."
        array: false

      - name: WorkingDir
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Working directory for the process. Defaults to the directory of <code>Filename</code>."
        array: false

      - name: StatusMsg
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Status message shown in the progress window while this entry executes."
        array: false

      - name: RunOnceId
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Unique identifier preventing duplicate execution on repeated installs (used in <code>[UninstallRun]</code>)."
        array: false

      - name: Verb
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shell verb used with the <code>shellexec</code> flag, e.g. <code>open</code>, <code>print</code>."
        array: false

      - name: OnLog
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure called for each output line (requires <code>logoutput</code> flag)."
        array: false
        since: "6.6"

      - name: Flags
        type:
          kind: flags
          flags:
            - name: postinstall
              description: "Shows a checkbox on the final wizard page letting the user choose whether to run this entry after installation."
              deprecated: false
              conflicts: [ ]
            - name: shellexec
              description: "Uses the Windows shell to open the file instead of executing it directly. Required for non-executable files."
              deprecated: false
              conflicts: [ ]
            - name: nowait
              description: "Does not wait for the process to finish before proceeding. Mutually exclusive with <code>waituntilterminated</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: waituntilterminated
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: runhidden
              description: "Runs the process with a hidden window. Has no effect when combined with <code>shellexec</code>."
              deprecated: false
              conflicts:
                - flag: shellexec
                  severity: warning
            - name: skipifsilent
              description: "Skips this entry when the installer is run silently. Mutually exclusive with <code>skipifnotsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifnotsilent
                  severity: error
            - name: skipifnotsilent
              description: "Skips this entry when the installer is run non-silently. Mutually exclusive with <code>skipifsilent</code>."
              deprecated: false
              conflicts:
                - flag: skipifsilent
                  severity: error
            - name: unchecked
              description: "The checkbox added by <code>postinstall</code> is unchecked by default."
              deprecated: false
              conflicts: [ ]
            - name: waituntilterminated
              description: "Waits until the process terminates before proceeding. This is the default behaviour. Mutually exclusive with <code>nowait</code> and <code>waituntilidle</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilidle
                  severity: error
            - name: waituntilidle
              description: "Waits until the process is idle (no input pending) before proceeding. Mutually exclusive with <code>nowait</code> and <code>waituntilterminated</code>."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: error
                - flag: waituntilterminated
                  severity: error
            - name: logoutput
              description: "Captures the process output and writes it to the setup log. Combining with <code>nowait</code> means output may be incomplete."
              deprecated: false
              conflicts:
                - flag: nowait
                  severity: warning
              since: "6.6"
            - name: runasoriginaluser
              description: "Runs the process as the user who launched the installer, not as the elevated user. Only relevant when running with elevated privileges."
              deprecated: false
              conflicts: [ ]
        required: false
        deprecated: false
        description: "Behavioural flags controlling how and when the program is executed."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

      - name: Tasks
        type:
