        required: false
        deprecated: false
        description: "Space-separated list of task names. This entry is processed only when at least one listed task is checked."
        array: true

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names. Limits this entry to the specified languages."
        array: true

      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: BeforeInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately before this entry is processed."
        array: false

      - name: AfterInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately after this entry is processed."
        array: false

      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version for which this entry applies. Use <code>0</code> to never apply."
