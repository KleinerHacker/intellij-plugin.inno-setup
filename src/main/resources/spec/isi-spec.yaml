    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Full path of the directory to create, e.g. <code>{app}\\data</code>. Supports all Inno Setup directory constants."
        array: false

      - name: Attribs
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "File system attributes to set on the directory: <code>readonly</code>, <code>hidden</code>, <code>system</code>, <code>notcontentindexed</code>."
        array: true

      - name: Permissions
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "ACL permissions to grant, e.g. <code>users-modify</code>, <code>everyone-readexec</code>. Avoid setting ACLs on top-level system directories."
        array: true

      - name: Flags
        type:
          kind: flags
          flags:
            - name: deleteafterinstall
              description: "Deletes the directory after the installation is complete. Useful for temporary directories created during install."
              deprecated: false
              conflicts: [ ]
            - name: setntfscompression
              description: "Sets NTFS compression on the directory."
              deprecated: false
              conflicts:
                - flag: unsetntfscompression
                  severity: error
            - name: uninsalwaysuninstall
              description: "Always removes this directory on uninstall, even if it is not empty."
              deprecated: false
              conflicts:
                - flag: uninsneveruninstall
                  severity: error
            - name: uninsneveruninstall
              description: "Never removes this directory on uninstall."
              deprecated: false
              conflicts:
                - flag: uninsalwaysuninstall
                  severity: error
            - name: unsetntfscompression
              description: "Removes NTFS compression from the directory."
              deprecated: false
              conflicts:
                - flag: setntfscompression
                  severity: error
        required: false
        deprecated: false
        description: "Behavioural flags controlling directory creation and removal."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

      - name: Tasks
        type:
          kind: reference
          section: Tasks
        required: false
        deprecated: false
        description: "Space-separated list of task names. This entry is processed only when at least one listed task is checked."
        array: true

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names. Limits this entry to the specified languages."
        array: true

      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: BeforeInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately before this entry is processed."
        array: false

      - name: AfterInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately after this entry is processed."
        array: false

      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version for which this entry applies. Use <code>0</code> to never apply."
