        description: "Maximum Windows version (exclusive) for which this entry applies. Use <code>0</code> for no upper limit."
        array: false

  # ---------------------------------------------------------------------------
  # [Files] — parameter section
  # ---------------------------------------------------------------------------
  - name: Files
    type: parameter
    deprecated: false
    description: "Specifies files to be installed. Wildcards and recursive directory copying are supported. This is the primary section for bundling application files."
    attributes:

      - name: Source
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Source file path or wildcard pattern, e.g. <code>MyProg.exe</code> or <code>Plugins\\*</code>. Relative to <code>SourceDir</code>."
        array: false

      - name: DestDir
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Destination directory on the target machine, e.g. <code>{app}</code> or <code>{sys}</code>. Supports all Inno Setup constants."
        array: false

      - name: DestName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Rename the file when installing. If omitted, the original filename is kept."
        array: false

      - name: Excludes
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Comma-separated list of filename patterns to exclude when using wildcards, e.g. <code>*.pdb,*.log</code>."
        array: false

      - name: ExternalSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Size in bytes of an external file (used with <code>external</code> flag) for accurate disk-space calculation."
        array: false

      - name: Attribs
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "File attributes to set after installation: <code>readonly</code>, <code>hidden</code>, <code>system</code>, <code>notcontentindexed</code>."
        array: true

      - name: Permissions
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "ACL permissions, e.g. <code>users-modify</code>, <code>everyone-readexec</code>."
        array: true

      - name: FontInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Registry font name used when installing a font file, e.g. <code>My Font (TrueType)</code>. Triggers font registration."
        array: false

      - name: StrongAssemblyName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: ".NET strong assembly name for GAC registration."
        array: false

      - name: Hash
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Expected SHA-256 hash of the source file for integrity verification at compile time."
        array: false
        since: "6.5"

      - name: ISSigAllowedKeys
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Comma-separated list of key identifiers from <code>[ISSigKeys]</code> used to verify the file's <code>.issig</code> signature."
        array: true
        since: "6.5"

      - name: ExtractArchivePassword
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Password for an encrypted archive (used with <code>extractarchive</code> flag). Stored unencrypted in the installer."
        array: false
        since: "6.5"

      - name: DownloadISSigSource
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "URL of the <code>.issig</code> signature file for a downloaded file."
        array: false
        since: "6.5"

      - name: DownloadUserName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "HTTP Basic Auth username for authenticated file downloads (used with <code>download</code> flag)."
        array: false
        since: "6.5"

      - name: DownloadPassword
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "HTTP Basic Auth password for authenticated file downloads (used with <code>download</code> flag)."
        array: false
        since: "6.5"

      - name: Flags
        type:
          kind: flags
          flags:
            - name: 32bit
              description: "Treats the file as a 32-bit resource. On 64-bit Windows, file-system and registry redirections apply. Mutually exclusive with <code>64bit</code>."
              deprecated: false
              conflicts:
                - flag: 64bit
                  severity: error
            - name: 64bit
              description: "Treats the file as a 64-bit resource. On 32-bit Windows this flag is silently ignored. Mutually exclusive with <code>32bit</code>."
              deprecated: false
              conflicts:
                - flag: 32bit
                  severity: error
            - name: comparetimestamp
              description: "Installs the file only if it is newer (by timestamp) than the existing file on disk."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: confirmoverwrite
              description: "Always asks the user for confirmation before overwriting an existing file."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: deleteafterinstall
              description: "Deletes the file after installation completes. Useful for temporary files. Cannot be combined with <code>restartreplace</code> or <code>sharedfile</code>."
              deprecated: false
              conflicts:
                - flag: restartreplace
                  severity: error
                - flag: sharedfile
                  severity: error
            - name: dontcopy
              description: "Prevents the file from being copied to disk. The file is still compressed into the installer and can be extracted via <code>[Code]</code>."
              deprecated: false
              conflicts: [ ]
            - name: download
              description: "Downloads the file from a URL at install time instead of embedding it. Requires the URL to be specified in <code>Source</code>."
              deprecated: false
              conflicts: [ ]
              since: "6.5"
            - name: external
              description: "The file is not embedded in the installer but must be present alongside it. Use <code>ExternalSize</code> to specify its size."
              deprecated: false
              conflicts:
                - flag: nocompression
                  severity: redundant
                - flag: noencryption
                  severity: redundant
                - flag: notimestamp
                  severity: redundant
                - flag: touch
                  severity: redundant
            - name: extractarchive
              description: "Extracts the contents of an archive (zip, 7z, etc.) instead of copying the archive file itself."
              deprecated: false
              conflicts:
                - flag: replacesameversion
                  severity: redundant
              since: "6.5"
            - name: ignoreversion
              description: "Does not compare version numbers; always installs the file regardless of the version on disk."
              deprecated: false
              conflicts:
                - flag: comparetimestamp
                  severity: warning
                - flag: confirmoverwrite
                  severity: warning
            - name: isreadme
              description: "Marks this file as the README. The installer may offer to open it after installation."
              deprecated: false
              conflicts: [ ]
            - name: nocompression
              description: "Stores this file uncompressed in the installer, even if compression is enabled globally."
              deprecated: false
              conflicts: [ ]
            - name: onlyifdoesntexist
              description: "Only installs the file if it does not already exist on the target machine."
              deprecated: false
              conflicts:
                - flag: ignoreversion
                  severity: warning
            - name: recursesubdirs
              description: "When <code>Source</code> contains a wildcard, also searches subdirectories recursively."
              deprecated: false
              conflicts: [ ]
            - name: createallsubdirs
              description: "Creates all subdirectories found when using <code>recursesubdirs</code>, even if they are empty."
              deprecated: false
              conflicts: [ ]
            - name: regserver
              description: "Registers the file as a COM server by calling <code>DllRegisterServer</code>."
              deprecated: false
              conflicts:
                - flag: regtypelib
                  severity: warning
            - name: regtypelib
              description: "Registers the file as a type library."
              deprecated: false
              conflicts:
                - flag: regserver
                  severity: warning
            - name: restartreplace
              description: "If the file is in use, schedules it to be replaced on the next system restart."
              deprecated: false
              conflicts:
                - flag: deleteafterinstall
                  severity: error
            - name: sharedfile
              description: "Registers the file as a shared file. The file is only removed on uninstall when no other application references it."
              deprecated: false
              conflicts:
                - flag: deleteafterinstall
                  severity: error
            - name: signcheck
              description: "Verifies the digital signature of the source file at compile time. Setup aborts if the file is not properly signed."
              deprecated: false
              conflicts: [ ]
              since: "6.4"
            - name: issigverify
              description: "Verifies the file's <code>.issig</code> cryptographic signature at install time using the keys defined in <code>[ISSigKeys]</code>."
              deprecated: false
              conflicts: [ ]
              since: "6.5"
            - name: notimestamp
              description: "Prevents the file's last-modified timestamp from being stored in the installer, enabling reproducible builds."
              deprecated: false
              conflicts: [ ]
              since: "6.7"
            - name: noencryption
              description: "Stores this file unencrypted in the installer, even if encryption is enabled globally via <code>Encryption</code>."
              deprecated: false
              conflicts: [ ]
            - name: touch
              description: "Sets the file's date and time to the current date and time (or the value of <code>TouchDate</code>/<code>TouchTime</code>) at install time."
              deprecated: false
              conflicts: [ ]
            - name: replacesameversion
              description: "Replaces an existing file even when it has the same version number, overriding the default behaviour of skipping same-version files."
              deprecated: false
              conflicts: [ ]
        required: false
        deprecated: false
        description: "Behavioural flags controlling how each file is installed."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
        description: "Space-separated list of component names. This entry is processed only when at least one listed component is selected."
        array: true

      - name: Tasks
        type:
          kind: reference
          section: Tasks
        required: false
        deprecated: false
        description: "Space-separated list of task names. This entry is processed only when at least one listed task is checked."
        array: true

      - name: Languages
        type:
          kind: reference
          section: Languages
        required: false
        deprecated: false
        description: "Space-separated list of language names. Limits this entry to the specified languages."
        array: true

      - name: Check
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal function (returning <code>Boolean</code>) in <code>[Code]</code>. The entry is processed only when the function returns <code>True</code>."
        array: false

      - name: BeforeInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately before this entry is processed."
        array: false

      - name: AfterInstall
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of a Pascal procedure in <code>[Code]</code> called immediately after this entry is processed."
        array: false

      - name: MinVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Minimum Windows version for which this entry applies. Use <code>0</code> to never apply."
        array: false

      - name: OnlyBelowVersion
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Maximum Windows version (exclusive) for which this entry applies. Use <code>0</code> for no upper limit."
        array: false

  # ---------------------------------------------------------------------------
  # [Icons] — parameter section
  # ---------------------------------------------------------------------------
  - name: Icons
    type: parameter
    deprecated: false
    description: "Creates shortcuts (Start Menu, Desktop, etc.) during installation. Each entry creates one shortcut."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Full path and name of the shortcut, e.g. <code>{group}\\My Program</code> or <code>{commondesktop}\\My Program</code>."
        array: false

      - name: Filename
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Target of the shortcut — an executable, document, folder, or URL."
        array: false

      - name: Parameters
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Command-line arguments passed to the target when the shortcut is activated."
        array: false

      - name: WorkingDir
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Working directory set when the shortcut is launched. Defaults to the target's directory."
        array: false

      - name: HotKey
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Global keyboard shortcut to launch the target, e.g. <code>ctrl+alt+k</code>."
        array: false

      - name: Comment
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Tooltip text shown when the user hovers over the shortcut."
        array: false

      - name: IconFilename
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Path to an <code>.ico</code>, <code>.exe</code>, or <code>.dll</code> containing the icon for this shortcut."
        array: false

      - name: IconIndex
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Zero-based index of the icon within <code>IconFilename</code>. Default: <code>0</code>."
        array: false

      - name: AppUserModelID
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Windows 7+ Application User Model ID, used to group taskbar buttons and toast notifications."
        array: false

      - name: AppUserModelToastActivatorCLSID
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Windows 10+ COM CLSID for toast notification activation."
        array: false
        since: "6.1"

      - name: Flags
        type:
          kind: flags
          flags:
            - name: runminimized
              description: "Launches the target application minimised. Mutually exclusive with <code>runmaximized</code>."
              deprecated: false
              conflicts:
                - flag: runmaximized
                  severity: error
            - name: runmaximized
              description: "Launches the target application maximised. Mutually exclusive with <code>runminimized</code>."
              deprecated: false
              conflicts:
                - flag: runminimized
                  severity: error
            - name: closeonexit
              description: "Closes the shortcut's target application when the user logs off."
              deprecated: false
              conflicts: [ ]
            - name: createonlyiffileexists
              description: "Only creates the shortcut if the target file actually exists on the machine."
              deprecated: false
              conflicts: [ ]
            - name: preventpinning
              description: "Prevents the shortcut from being pinned to the Windows 7+ taskbar or Start Menu."
              deprecated: false
              conflicts: [ ]
        required: false
        deprecated: false
        description: "Behavioural flags controlling shortcut creation and launch behaviour."
        array: true

      # Common parameters
      - name: Components
        type:
          kind: reference
          section: Components
        required: false
        deprecated: false
