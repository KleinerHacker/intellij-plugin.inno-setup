  # ---------------------------------------------------------------------------
  # [Languages] — parameter section
  # ---------------------------------------------------------------------------
  - name: Languages
    type: parameter
    deprecated: false
    description: "Declares the languages available in the installer. Each entry points to an ISL message file. The first entry becomes the default language."
    attributes:

      - name: Name
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Internal language identifier, e.g. <code>english</code>, <code>german</code>. Referenced by the <code>Languages</code> common parameter."
        array: false

      - name: MessagesFile
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Path to the ISL message file. Use <code>compiler:Default.isl</code> for the built-in English messages or <code>compiler:Languages\\German.isl</code> for bundled translations."
        array: false

  # ---------------------------------------------------------------------------
  # [LangOptions] — directive section
  # ---------------------------------------------------------------------------
  - name: LangOptions
    type: directive
    deprecated: false
    description: "Language-specific display settings (fonts, language ID/codepage, text direction). Primarily set inside <code>.isl</code> message files, but may be overridden per language in the script. Directives may be prefixed with a language name, e.g. <code>german.DialogFontName</code>."
    attributes:

      - name: LanguageName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "The native name of the language, displayed in the language selection dialog of a multilingual installer, e.g. <code>Deutsch</code>."
        array: false

      - name: LanguageID
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Numeric Windows language identifier used for automatic language detection, given in Pascal hexadecimal form, e.g. <code>$0409</code> (English &ndash; United States) or <code>$0407</code> (German &ndash; Germany)."
        array: false

      - name: LanguageCodePage
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "The code page used to convert the non-Unicode text in the message file. Set to <code>0</code> if the message file contains only Unicode/ASCII characters."
        array: false

      - name: DialogFontName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Font used for most text in the wizard. Defaults to 9&nbsp;pt Segoe UI when left empty."
        array: false

      - name: DialogFontSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Point size of the dialog font. Default: <code>9</code>."
        array: false

      - name: DialogFontBaseScaleWidth
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Base width, in pixels, used to scale dialog controls relative to the dialog font. Default: <code>7</code>."
        array: false

      - name: DialogFontBaseScaleHeight
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Base height, in pixels, used to scale dialog controls relative to the dialog font. Default: <code>15</code>."
        array: false

      - name: WelcomeFontName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Font used for the large heading on the Welcome and Setup Completed pages. Defaults to 14&nbsp;pt Segoe UI when left empty."
        array: false

      - name: WelcomeFontSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Point size of the welcome font. Default: <code>14</code>."
        array: false

      - name: RightToLeft
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "Whether the language is written right-to-left. Set to <code>1</code> to enable, <code>0</code> (default) for left-to-right."
        array: false

      - name: TitleFontName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "(Removed in Inno Setup 6.4) Font formerly used for the application name on the background window."
        array: false
        until: "6.4"

      - name: TitleFontSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "(Removed in Inno Setup 6.4) Point size of the former title font."
        array: false
        until: "6.4"

      - name: CopyrightFontName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "(Removed in Inno Setup 6.4) Font formerly used for the <code>AppCopyright</code> text on the background window."
        array: false
        until: "6.4"

      - name: CopyrightFontSize
        type:
          kind: native
          dataType: integer
        required: false
        deprecated: false
        description: "(Removed in Inno Setup 6.4) Point size of the former copyright font."
        array: false
        until: "6.4"

  # ---------------------------------------------------------------------------
  # [Messages] — directive section
  # ---------------------------------------------------------------------------
  - name: Messages
    type: directive
    deprecated: false
    description: "Overrides the built-in installer message strings (defined in <code>Default.isl</code> and the bundled <code>.isl</code> files). Each entry is <code>MessageName=Text</code> and may be prefixed with a language name to target a single language, e.g. <code>english.WelcomeLabel1</code>."
    internationalization: true
    attributes:

      # *** Application titles ***
      - name: SetupAppTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Window class title of the installer, e.g. Setup."
        array: false

      - name: SetupWindowTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Title bar caption of the installer window; %1 is replaced by the application name."
        array: false

      - name: UninstallAppTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Short title of the uninstaller, e.g. Uninstall."
        array: false

      - name: UninstallAppFullTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Full title bar caption of the uninstaller; %1 is the application name."
        array: false

      # *** Misc. common ***
      - name: InformationTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Caption of generic information dialog boxes."
        array: false

      - name: ConfirmTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Caption of generic confirmation dialog boxes."
        array: false

      - name: ErrorTitle
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Caption of generic error dialog boxes."
        array: false

      # *** SetupLdr (setup loader) messages ***
      - name: SetupLdrStartupMessage
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Prompt shown before installation begins; %1 is the application name."
        array: false

      - name: LdrCannotCreateTemp
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when the loader cannot create a temporary file."
        array: false

      - name: LdrCannotExecTemp
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when the loader cannot execute the extracted temporary file."
        array: false

      # *** Startup error messages ***
      - name: HelpTextNote
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Note appended to the /HELP command-line help dialog."
        array: false

      - name: LastErrorMessage
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Wraps a system error: %1 is the message text, %2 the error code."
        array: false

      - name: SetupFileMissing
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when a required file is missing from the installation folder; %1 is the file name."
        array: false

      - name: SetupFileCorrupt
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when the setup files are corrupted."
        array: false

      - name: SetupFileCorruptOrWrongVer
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when setup files are corrupted or incompatible with this version of Setup."
        array: false

      - name: InvalidParameter
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when an invalid command-line parameter was passed; %1 is the parameter."
        array: false

      - name: SetupAlreadyRunning
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when another instance of Setup is already running."
        array: false

      - name: WindowsVersionNotSupported
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when the Windows version is not supported by the application."
        array: false

      - name: WindowsServicePackRequired
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when a required Windows edition or service pack is missing; %1/%2 give the requirement."
        array: false

      - name: NotOnThisPlatform
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Shown when the program cannot run on this Windows version; %1 is the required platform."
        array: false

      - name: OnlyOnThisPlatform
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
