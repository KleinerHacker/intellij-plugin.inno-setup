  # ---------------------------------------------------------------------------
  # [Registry] — parameter section
  # ---------------------------------------------------------------------------
  - name: Registry
    type: parameter
    deprecated: false
    description: "Creates, modifies, or deletes registry keys and values during installation. Supports optional cleanup on uninstall via flags."
    attributes:

      - name: Root
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Registry root hive: <code>HKCU</code>, <code>HKLM</code>, <code>HKCR</code>, <code>HKU</code>, <code>HKCC</code>, <code>HKA</code>. Append <code>32</code> or <code>64</code> to force a specific registry view."
        array: false

      - name: Subkey
        type:
          kind: native
          dataType: string
        required: true
        deprecated: false
        description: "Registry key path relative to <code>Root</code>, e.g. <code>Software\\My Company\\My App</code>."
        array: false

      - name: ValueType
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Type of the registry value: <code>none</code> (key only), <code>string</code>, <code>expandsz</code>, <code>multisz</code>, <code>dword</code>, <code>qword</code>, <code>binary</code>."
        array: false

      - name: ValueName
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Name of the registry value. Leave empty to set the default value of the key."
        array: false

      - name: ValueData
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "Data to write. Use <code>{olddata}</code> to append to an existing value, or <code>{break}</code> as a line separator for <code>multisz</code>."
        array: false

      - name: Permissions
        type:
          kind: native
          dataType: string
        required: false
        deprecated: false
        description: "ACL permissions for the key: <code>full</code>, <code>modify</code>, <code>read</code>."
        array: true

      - name: Flags
        type:
          kind: flags
          flags:
            - name: createvalueifdoesntexist
              description: "Only writes the value if it does not already exist in the registry."
              deprecated: false
              conflicts:
                - flag: deletevalue
                  severity: error
                - flag: deletekey
                  severity: error
            - name: deletekey
              description: "Deletes the entire registry key and all its subkeys and values before creating it."
              deprecated: false
              conflicts:
                - flag: deletevalue
                  severity: warning
                - flag: createvalueifdoesntexist
                  severity: error
            - name: deletevalue
              description: "Deletes the specified registry value."
              deprecated: false
              conflicts:
                - flag: deletekey
                  severity: warning
            - name: dontcreatekey
              description: "Does not create the registry key if it does not exist. Silently skips the entry."
              deprecated: false
              conflicts:
                - flag: deletekey
                  severity: warning
            - name: noerror
              description: "Suppresses errors if the operation fails (e.g. the key does not exist)."
              deprecated: false
              conflicts: [ ]
            - name: preservestringtype
              description: "When overwriting an existing string value, preserves its original type (REG_SZ vs REG_EXPAND_SZ)."
              deprecated: false
              conflicts: [ ]
            - name: uninsclearvalue
              description: "Sets the value to an empty string on uninstall instead of deleting it."
              deprecated: false
              conflicts:
                - flag: uninsdeletevalue
                  severity: warning
                - flag: uninsdeletekey
                  severity: warning
            - name: uninsdeletekey
              description: "Deletes the entire registry key on uninstall."
              deprecated: false
              conflicts:
                - flag: uninsdeletekeyifempty
                  severity: warning
                - flag: uninsclearvalue
                  severity: warning
            - name: uninsdeletekeyifempty
              description: "Deletes the registry key on uninstall only if it contains no values or subkeys."
              deprecated: false
              conflicts:
                - flag: uninsdeletekey
                  severity: warning
            - name: uninsdeletevalue
