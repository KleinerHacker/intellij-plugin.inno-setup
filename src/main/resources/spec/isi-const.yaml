# $schema: ./isi-const.json
constants:

  # ── Directory Constants ────────────────────────────────────────────────────

  - name: app
    description: >
      The application directory, which the user selects on the
      <i>Select Destination Location</i> page of the wizard.
      If <code>DefaultDirName</code> is <code>{autopf}\My Program</code>,
      this typically resolves to <code>C:\Program Files\My Program</code>.
    deprecated: []
    type: directory

  - name: win
    description: "The system's Windows directory, e.g. <code>C:\\Windows</code>."
    deprecated: []
    type: directory

  - name: sys
    description: >
      The system's System32 directory, e.g. <code>C:\Windows\System32</code>.
      On 64-bit Windows in 32-bit install mode, this maps to <code>SysWOW64</code>.
      Use <code>{sysnative}</code> to access the real 64-bit System32.
    deprecated: []
    type: directory

  - name: sysnative
    description: >
      On 64-bit Windows, the true 64-bit System32 directory
      (e.g. <code>C:\Windows\System32</code>), regardless of install mode.
      On 32-bit Windows, equivalent to <code>{sys}</code>.
    deprecated: []
    type: directory

  - name: syswow64
    description: >
      On 64-bit Windows, the SysWOW64 directory that holds 32-bit system files
      (e.g. <code>C:\Windows\SysWOW64</code>).
      Should not be used when <code>{sys}</code> is sufficient.
    deprecated: []
    type: directory

  - name: src
    description: >
      The directory in which the Setup files are located.
      When installing from CD-ROM, this is the root directory of the disc.
    deprecated: []
    type: directory

  - name: sd
    description: >
      System Drive — the drive Windows is installed on, typically <code>C:</code>.
      Includes drive letter and colon, no trailing backslash.
    deprecated: []
    type: directory

  - name: commonpf
    description: >
      The Program Files directory. In 64-bit install mode maps to <code>{commonpf64}</code>;
      in 32-bit mode to <code>{commonpf32}</code>.
    deprecated: []
    type: directory

  - name: commonpf32
    description: "The system's 32-bit Program Files directory, e.g. <code>C:\\Program Files (x86)</code> on 64-bit Windows."
    deprecated: []
    type: directory

  - name: commonpf64
    description: >
      The system's 64-bit Program Files directory, e.g. <code>C:\Program Files</code>.
      Only meaningful on 64-bit Windows.
    deprecated: []
    type: directory

  - name: commoncf
    description: >
      The Common Files directory. In 64-bit install mode maps to <code>{commoncf64}</code>;
      in 32-bit mode to <code>{commoncf32}</code>.
    deprecated: []
    type: directory

  - name: commoncf32
    description: "The system's 32-bit Common Files directory."
    deprecated: []
    type: directory

  - name: commoncf64
    description: "The system's 64-bit Common Files directory. Only meaningful on 64-bit Windows."
    deprecated: []
    type: directory

  - name: tmp
    description: >
      Temporary directory used internally by Setup or Uninstall.
      All files placed here are deleted automatically when the process finishes.
    deprecated: []
    type: directory

  - name: commonfonts
    description: "The Fonts directory — normally the <code>Fonts</code> subfolder of the Windows directory."
    deprecated: []
    type: directory
    since: "6.1"

  - name: dao
    description: "The DAO directory. Equivalent to <code>{commoncf}\\Microsoft Shared\\DAO</code>."
    deprecated: []
    type: directory

  - name: dotnet11
    description: "The 32-bit .NET Framework version 1.1 install root directory."
    deprecated: []
    type: directory

  - name: dotnet20
    description: "The .NET Framework version 2.0–3.5 install root directory (adapts to install mode)."
    deprecated: []
    type: directory

  - name: dotnet2032
    description: "The 32-bit .NET Framework version 2.0–3.5 install root directory."
    deprecated: []
    type: directory

  - name: dotnet2064
    description: "The 64-bit .NET Framework version 2.0–3.5 install root directory. Only valid on 64-bit Windows."
    deprecated: []
    type: directory

  - name: dotnet40
    description: "The .NET Framework version 4.0 and later install root directory (adapts to install mode)."
    deprecated: []
    type: directory

  - name: dotnet4032
    description: "The 32-bit .NET Framework version 4.0 and later install root directory."
    deprecated: []
    type: directory

  - name: dotnet4064
    description: "The 64-bit .NET Framework version 4.0 and later install root directory. Only valid on 64-bit Windows."
    deprecated: []
    type: directory

  # ── Shell Folder Constants ─────────────────────────────────────────────────

  - name: group
    description: >
      The path to the Start Menu folder as selected by the user on the
      <i>Select Start Menu Folder</i> page, e.g.
      <code>C:\ProgramData\Microsoft\Windows\Start Menu\Programs\My Program</code>.
    deprecated: []
    type: shell_folder

  - name: localappdata
    description: "The path to the current user's local (non-roaming) Application Data folder."
    deprecated: []
    type: shell_folder

  - name: userappdata
    description: "The path to the current user's roaming Application Data folder."
    deprecated: []
    type: shell_folder

  - name: commonappdata
    description: "The path to the Application Data folder shared by all users, e.g. <code>C:\\ProgramData</code>."
    deprecated: []
    type: shell_folder

  - name: usercf
    description: "The current user's Common Files folder. Available on Windows 7 and later."
    deprecated: []
    type: shell_folder

  - name: userdesktop
    description: "The path to the current user's Desktop folder."
    deprecated: []
    type: shell_folder

  - name: commondesktop
    description: "The path to the Desktop folder shared by all users."
    deprecated: []
    type: shell_folder

  - name: userdocs
    description: "The path to the current user's My Documents folder."
    deprecated: []
    type: shell_folder

  - name: commondocs
    description: "The path to the My Documents folder shared by all users."
    deprecated: []
    type: shell_folder

  - name: userfavorites
    description: "The path to the current user's Favorites folder."
    deprecated: []
    type: shell_folder

  - name: userfonts
    description: "The current user's Fonts folder. Available on Windows 10 version 1803 and later."
    deprecated: []
    type: shell_folder
    since: "6.1"

  - name: userpf
    description: "The current user's Program Files folder. Available on Windows 7 and later."
    deprecated: []
    type: shell_folder

  - name: userprograms
    description: "The path to the Programs folder on the current user's Start Menu."
    deprecated: []
    type: shell_folder

  - name: commonprograms
    description: "The path to the Programs folder on the Start Menu shared by all users."
    deprecated: []
    type: shell_folder

  - name: usersavedgames
    description: "The path to the current user's Saved Games folder."
    deprecated: []
    type: shell_folder

  - name: usersendto
    description: "The path to the current user's Send To folder."
    deprecated: []
    type: shell_folder

  - name: userstartmenu
    description: "The path to the top level of the current user's Start Menu."
    deprecated: []
    type: shell_folder

  - name: commonstartmenu
    description: "The path to the top level of the Start Menu shared by all users."
    deprecated: []
    type: shell_folder

  - name: userstartup
    description: "The path to the Startup folder on the current user's Start Menu."
    deprecated: []
    type: shell_folder

  - name: commonstartup
    description: "The path to the Startup folder on the Start Menu shared by all users."
    deprecated: []
    type: shell_folder

  - name: usertemplates
    description: "The path to the current user's Templates folder."
    deprecated: []
    type: shell_folder

  - name: commontemplates
    description: "The path to the Templates folder shared by all users."
    deprecated: []
    type: shell_folder

  # ── Auto Constants ─────────────────────────────────────────────────────────

  - name: autoappdata
    description: "Resolves to <code>{commonappdata}</code> in admin install mode, <code>{userappdata}</code> otherwise."
    deprecated: []
    type: auto

  - name: autocf
