    deprecated: []
    type: auto

  - name: autotemplates
    description: "Resolves to <code>{commontemplates}</code> in admin install mode, <code>{usertemplates}</code> otherwise."
    deprecated: []
    type: auto

  # ── Special / Other Constants ──────────────────────────────────────────────

  - name: "\\"
    description: "A literal backslash character. Use this when a trailing backslash is needed after a path constant."
    deprecated: []
    type: special

  - name: cmd
    description: "The full pathname of the system's command interpreter, e.g. <code>C:\\Windows\\System32\\cmd.exe</code>."
    deprecated: []
    type: special

  - name: computername
    description: "The name of the computer on which Setup or Uninstall is running."
    deprecated: []
    type: special

  - name: groupname
    description: >
      The folder name (without path) selected by the user on the
      <i>Select Start Menu Folder</i> page. Use <code>{group}</code> for the full path.
    deprecated: []
    type: special

  - name: language
    description: "The internal name of the language selected by the user, as defined in the <code>[Languages]</code> section."
    deprecated: []
    type: special

  - name: log
    description: "The full path of the Setup log file, or an empty string if logging is not enabled."
    deprecated: []
    type: special

  - name: srcexe
    description: "The full pathname of the running Setup program file."
    deprecated: []
    type: special

  - name: uninstallexe
    description: "The full pathname of the uninstall program extracted by Setup."
    deprecated: []
    type: special

  - name: username
    description: "The name of the user who is running Setup or Uninstall."
    deprecated: []
    type: special

  - name: wizardhwnd
    description: "The window handle (HWND) of the Setup wizard window as a decimal string. Useful for Win32 API calls from <code>[Code]</code>."
    deprecated: []
    type: special

  - name: sysuserinfoname
    description: "The registered owner name of the Windows installation."
    deprecated: []
    type: special

  - name: sysuserinfoorg
    description: "The registered organization name of the Windows installation."
    deprecated: []
    type: special

  - name: userinfoname
    description: "The name entered by the user on the <i>User Information</i> wizard page."
    deprecated: []
    type: special

  - name: userinfoorg
    description: "The organization entered by the user on the <i>User Information</i> wizard page."
    deprecated: []
    type: special

  - name: userinfoserial
    description: "The serial number entered by the user on the <i>User Information</i> wizard page."
    deprecated: []
    type: special

  # ── Parameterized Constants ────────────────────────────────────────────────

  - name: "%"
    description: >
      Embeds the value of an environment variable at runtime.
      Falls back to the default value if the variable is not defined.<br>
      <b>Syntax:</b> <code>{%EnvName|DefaultValue}</code><br>
      <b>Example:</b> <code>{%USERPROFILE|{userdocs}}</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "%EnvName|DefaultValue"

  - name: reg
    description: >
      Reads a value from the Windows Registry at runtime.<br>
      <b>Syntax:</b> <code>{reg:HKxx\SubkeyName,ValueName|DefaultValue}</code><br>
      Supported root keys: <code>HKLM</code>, <code>HKCU</code>, <code>HKCR</code>,
      <code>HKU</code>, <code>HKCC</code>. Append <code>32</code> or <code>64</code>
      to force a registry view.<br>
      <b>Example:</b> <code>{reg:HKLM\Software\MyApp,InstallPath|{app}}</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "reg:HKxx\\SubkeyName,ValueName|DefaultValue"

  - name: ini
    description: >
      Reads a value from an <code>.ini</code> file at runtime.<br>
      <b>Syntax:</b> <code>{ini:Filename,Section,Key|DefaultValue}</code><br>
      <b>Example:</b> <code>{ini:{win}\MyApp.ini,Settings,DataDir|{app}}</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "ini:Filename,Section,Key|DefaultValue"

  - name: drive
    description: >
      Extracts and returns the drive letter and colon from the specified path.<br>
      <b>Syntax:</b> <code>{drive:Path}</code><br>
      <b>Example:</b> <code>{drive:{src}}</code> → <code>D:</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "drive:Path"

  - name: param
    description: >
      Embeds the value of a command-line parameter passed to Setup.
      Falls back to the default if the parameter was not supplied.<br>
      <b>Syntax:</b> <code>{param:ParamName|DefaultValue}</code><br>
      <b>Example:</b> <code>{param:Server|localhost}</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "param:ParamName|DefaultValue"

  - name: cm
    description: >
      Embeds the value of a custom message from <code>[CustomMessages]</code>,
      localized for the selected language. Supports printf-style arguments.<br>
      <b>Syntax:</b> <code>{cm:MessageName}</code> or
      <code>{cm:MessageName,Arg1,Arg2,...}</code><br>
      <b>Example:</b> <code>{cm:LaunchProgram,My App}</code>
    deprecated: []
    type: parameterized
    parameterized: true
    syntax: "cm:MessageName[,Arguments]"

