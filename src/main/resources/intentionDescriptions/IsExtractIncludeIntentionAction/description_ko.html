<html>
<body>
선택한 줄을 새 파일로 추출하고, 해당 줄을 그 파일에 대한 <code>#include</code> 로 대체합니다.
<!-- tooltip end -->
<p>
    <code>.iss</code> 스크립트 안에 선택 영역이 있을 때 사용할 수 있습니다. 선택 영역은 전체 줄로
    확장되고 대상 파일 이름을 입력하도록 요청합니다. 새 파일은 현재 스크립트 옆에 만들어지며
    (기존 파일은 확인 후에만 덮어씁니다), 추출된 줄은 <code>#include "&lt;name&gt;"</code> 로
    대체됩니다.
</p>
</body>
</html>
