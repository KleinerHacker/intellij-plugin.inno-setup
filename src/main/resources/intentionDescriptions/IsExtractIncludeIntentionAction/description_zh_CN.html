<html>
<body>
将选定的行提取到一个新文件中，并用对该文件的 <code>#include</code> 替换这些行。
<!-- tooltip end -->
<p>
    当 <code>.iss</code> 脚本中存在选区时可用。选区会被扩展为完整的行，并要求输入目标文件名。
    新文件会创建在当前脚本旁边（仅在确认后才覆盖已有文件），被提取的行将替换为
    <code>#include "&lt;name&gt;"</code>。
</p>
</body>
</html>
