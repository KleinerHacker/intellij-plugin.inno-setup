<html>
<body>
選択した行を新しいファイルに抽出し、その行をそのファイルへの <code>#include</code> に置き換えます。
<!-- tooltip end -->
<p>
    <code>.iss</code> スクリプト内で選択範囲がある場合に使用できます。選択範囲は行全体に拡張され、
    対象ファイル名の入力を求められます。新しいファイルは現在のスクリプトの隣に作成され
    （既存のファイルは確認後にのみ上書きされます）、抽出された行は
    <code>#include "&lt;name&gt;"</code> に置き換えられます。
</p>
</body>
