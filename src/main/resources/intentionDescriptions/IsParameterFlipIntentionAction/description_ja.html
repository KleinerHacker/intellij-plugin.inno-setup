Inno Setup のセクションエントリ（例: <code>[Files]</code> や <code>[Registry]</code> の行）にある
隣り合う 2 つのパラメータを入れ替えます。
<!-- tooltip end -->
<p>
    セクションのパラメータエントリ内で、パラメータ区切り文字（<code>;</code>）の直後に
    キャレットがある場合に使用できます。実行すると、区切り文字の前のパラメータが、
    その後に続くパラメータの後ろへ移動します。
</p>
