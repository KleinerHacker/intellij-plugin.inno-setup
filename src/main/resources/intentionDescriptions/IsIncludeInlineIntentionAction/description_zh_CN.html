将 <code>#include "file"</code> 行替换为所包含文件的原始内容。

<p>
    当光标位于某个 <code>#include</code> 行上，且其路径（相对于包含它的脚本所在目录）解析到一个
    现有文件时可用。仅内联一层；插入文本中嵌套的 <code>#include</code> 行将保持原样。内联后会询问
    是否删除已不再使用的 include 文件。
