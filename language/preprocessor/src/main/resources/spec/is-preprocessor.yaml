directives:
  - name: define
    syntax: "#define [Scope] Name [Value]"
    description: "Defines a macro variable. Without value, defines it as void (empty). An optional scope keyword (public/protected/private) may precede the name."
    deprecated: [ ]
  - name: undef
    syntax: "#undef [Scope] Name"
    description: "Undefines a previously defined identifier. An optional scope keyword (public/protected/private) may precede the name."
    deprecated: [ ]
  - name: dim
    syntax: "#dim [Scope] Name[Size] [{Init, ...}]"
    description: >
      Declares a zero-based array variable of the given size; unset elements are void. An optional scope
      keyword (public/protected/private) may precede the name, and an optional <code>{...}</code> list
      initialises the leading elements. Elements are assigned with <code>#define Name[Index] Value</code> and
      read as <code>Name[Index]</code>; <code>DimOf(Name)</code> returns the element count.
    deprecated: [ ]
  - name: redim
    syntax: "#redim [Scope] Name[NewSize]"
    description: >
      Resizes an existing array declared with #dim; existing elements within the new bounds are preserved and
      new elements are void. An optional scope keyword (public/protected/private) may precede the name.
    deprecated: [ ]
  - name: include
    syntax: "#include Filename"
    description: >
      Includes another script file. Use <code>compiler:filename</code> to search
      in the compiler directory.
      <b>Example:</b> <code>#include "common.iss"</code>
    deprecated: [ ]
  - name: file
    syntax: "#file Filename"
    description: "Similar to #include but for binary/raw file inclusion."
    deprecated: [ ]
  - name: emit
    syntax: "#emit Expr"
    description: "Evaluates the expression and outputs the result as script text."
    deprecated: [ ]
  - name: expr
    syntax: "#expr Expr"
    description: "Evaluates the expression without producing output (for side effects)."
    deprecated: [ ]
  - name: insert
    syntax: "#insert Expr"
    description: "Inserts the result of the expression at the current position."
    deprecated: [ ]
  - name: append
    syntax: "#append Expr"
    description: "Appends the result of the expression to the current line."
    deprecated: [ ]
  - name: if
    syntax: "#if Expr"
    description: >
      Conditionally includes the following lines until <code>#else</code>
      or <code>#endif</code> based on whether Expr is non-zero/non-empty.
    deprecated: [ ]
  - name: elif
    syntax: "#elif Expr"
    description: "Else-if branch for a preceding #if or #elif."
    deprecated: [ ]
  - name: else
    syntax: "#else"
    description: "Else branch for a preceding #if or #elif."
    deprecated: [ ]
  - name: endif
    syntax: "#endif"
    description: "Closes a conditional block opened by #if, #ifdef, #ifndef, #ifexist, or #ifnexist."
    deprecated: [ ]
  - name: ifdef
    syntax: "#ifdef Name"
    description: "True if the identifier is defined (regardless of value)."
    deprecated: [ ]
  - name: ifndef
    syntax: "#ifndef Name"
    description: "True if the identifier is NOT defined."
    deprecated: [ ]
  - name: ifexist
    syntax: "#ifexist Filename"
    description: "True if the specified file exists on disk."
    deprecated: [ ]
  - name: ifnexist
    syntax: "#ifnexist Filename"
    description: "True if the specified file does NOT exist on disk."
    deprecated: [ ]
  - name: for
    syntax: "#for {Var = Start; Cond; Incr} Body"
    description: >
      Compile-time loop. Repeats the body while Cond is non-zero.
      Variables are ISPP identifiers.
    deprecated: [ ]
  - name: sub
    syntax: "#sub Name"
    description: "Begins a subroutine definition. Ended by #endsub."
    deprecated: [ ]
  - name: endsub
    syntax: "#endsub"
    description: "Ends a subroutine definition started with #sub."
    deprecated: [ ]
  - name: pragma
    syntax: "#pragma <sub-command> [arguments]"
    description: >
      Controls the preprocessor itself via a sub-command. Sub-commands set reading/parsing options
      (<code>option</code>, <code>parseroption</code>), emit diagnostics (<code>message</code>,
      <code>warning</code>, <code>error</code>), adjust the verbosity threshold
      (<code>verboselevel</code>), change the inline-directive delimiters
      (<code>inlinestart</code>, <code>inlineend</code>), set include search paths
      (<code>include</code>) or define the line-continuation symbol (<code>spansymbol</code>).
    deprecated: [ ]
  - name: error
    syntax: "#error Message"
    description: "Triggers a compile-time error with the given message string."
    deprecated: [ ]
predefined_variables:
  - name: __COUNTER__
    type: int
    description: "Auto-incrementing counter; increments each time it is used."

  - name: __LINE__
    type: int
    description: "The current line number in the current file."

  - name: __FILENAME__
    type: str
    description: "The filename portion of the current include file path."

  - name: __PATHFILENAME__
    type: str
    description: "The full path of the current include file."

  - name: __DIR__
    type: str
    description: "The directory portion of the current include file path."

  - name: __INCLUDE__
    type: str
    description: "The current include path (multiple paths separated by semicolons)."

  - name: __WIN32__
    type: void
    description: "Always defined. Can be used with #ifdef to detect ISPP environment."

  - name: ISPP_INVOKED
    type: void
    description: "Always defined when ISPP is active."

  - name: ISCC_INVOKED
    type: void
    description: "Defined when compilation uses the console-mode compiler (ISCC.exe)."

  - name: PREPROCVER
    type: int
    description: "32-bit packed version number of the Inno Setup preprocessor."

  - name: Ver
    type: int
    description: "Alias for PREPROCVER."

  - name: WINDOWS
    type: void
    description: "Always defined."

  - name: UNICODE
    type: void
    description: "Always defined (ISPP is Unicode-only)."

  - name: CompilerPath
    type: str
    description: "The directory where the Inno Setup compiler (ISCC.exe) is located."

  - name: SourcePath
    type: str
    description: "The directory containing the root script file."

  - name: SysPath
    type: str
    description: "The system directory appropriate to the compiler type."

  - name: NewLine
    type: str
    description: "The newline character sequence."

  - name: Tab
    type: str
    description: "The tab character."

  - name: Local
    type: str
    description: >
      Predefined array holding local values inside a macro body. Its elements
      (<code>Local[0]</code>, <code>Local[1]</code>, …) need no <code>#dim</code> declaration and are
      typically used to keep an intermediate result, e.g.
      <code>#define M(str S) Local[0] = f(S), g(Local[0])</code>.

builtin_functions:
  # Sorted alphabetically to match the official ISPP function index (topic_funcs).
  - name: AddBackslash
    signature: "AddBackslash(S: str): str"
    return_type: str
    description: "Adds a trailing backslash to S if not already present."

  - name: AddQuotes
    signature: "AddQuotes(S: str): str"
    return_type: str
    description: "Surrounds S with double quotes if it contains spaces."

  - name: ChangeFileExt
    signature: "ChangeFileExt(Filename: str, Extension: str): str"
    return_type: str
    description: "Returns Filename with its extension replaced by Extension."

  - name: ComparePackedVersion
    signature: "ComparePackedVersion(Version1: int, Version2: int): int"
    return_type: int
    description: "Compares two packed (encoded) version numbers; returns -1, 0 or 1."

  - name: Copy
    signature: "Copy(S: str, Index: int, Count: int): str"
    return_type: str
    description: "Returns a substring of S. Index is 1-based."

  - name: CopyFile
    pure: false
    signature: "CopyFile(ExistingFile: str, NewFile: str): int"
    return_type: int
    description: "Copies an existing file at compile time; returns non-zero on success."

  - name: DecodeVer
    signature: "DecodeVer(Version: int): str"
    return_type: str
    description: "Converts a packed version number into a dotted version string."

  - name: Defined
    signature: "Defined(Ident): int"
    return_type: int
    description: "Returns 1 if the identifier is defined, 0 otherwise."

  - name: Delete
    signature: "Delete(S: str*, Index: int, Count: int)"
    return_type: void
    description: "Deletes Count characters from S starting at Index (modifies S by reference)."

  - name: DeleteFile
    pure: false
    signature: "DeleteFile(Filename: str): int"
    return_type: int
    description: "Deletes a file at compile time; returns non-zero on success."

  - name: DeleteFileNow
    pure: false
    signature: "DeleteFileNow(Filename: str): int"
    return_type: int
    description: "Deletes a file immediately during preprocessing; returns non-zero on success."

  - name: DimOf
    signature: "DimOf(Array): int"
    return_type: int
    description: "Returns the number of elements of an array variable."

  - name: DirExists
    pure: false
    signature: "DirExists(Path: str): int"
    return_type: int
    description: "Returns 1 if the directory exists, 0 otherwise."

  - name: EmitLanguagesSection
    pure: false
    signature: "EmitLanguagesSection()"
    return_type: void
    description: "Emits a [Languages] section from the bundled language files."

  - name: EncodeVer
    signature: "EncodeVer(Major: int, Minor: int, Revision: int = 0, Build: int = 0): int"
    return_type: int
    description: "Encodes version components into a single packed version number."

  - name: EntryCount
    pure: false
    signature: "EntryCount(Section: str): int"
    return_type: int
    description: "Returns the number of entries in the given script section."

  - name: Error
    pure: false
    signature: "Error(Message: str)"
    return_type: void
    description: "Raises a compile-time error with the given message."

  - name: Exec
    pure: false
    signature: "Exec(CmdLine: str, Params: str = \"\", WorkingDir: str = \"\", ShowCmd: int = 0, Wait: int = 0): int"
    return_type: int
    description: "Executes a program at compile time; returns the process exit code."

  - name: ExecAndGetFirstLine
    pure: false
    signature: "ExecAndGetFirstLine(CmdLine: str, Params: str = \"\", WorkingDir: str = \"\"): str"
    return_type: str
    description: "Executes a program and returns the first line of its standard output."

  - name: ExtractFileDir
    signature: "ExtractFileDir(Filename: str): str"
    return_type: str
    description: "Returns the directory part of Filename (without a trailing backslash)."

  - name: ExtractFileExt
    signature: "ExtractFileExt(Filename: str): str"
    return_type: str
    description: "Returns the extension of Filename (including the leading dot)."

  - name: ExtractFileName
    signature: "ExtractFileName(Filename: str): str"
    return_type: str
    description: "Returns the name and extension part of Filename."

  - name: ExtractFilePath
    signature: "ExtractFilePath(Filename: str): str"
    return_type: str
    description: "Returns the drive and directory part of Filename (with a trailing backslash)."

  - name: FileClose
    pure: false
    signature: "FileClose(Handle: int)"
    return_type: void
    description: "Closes a file previously opened with FileOpen."

  - name: FileEof
    pure: false
    signature: "FileEof(Handle: int): int"
    return_type: int
    description: "Returns non-zero when the end of an open file has been reached."

  - name: FileExists
    pure: false
    signature: "FileExists(Filename: str): int"
    return_type: int
    description: "Returns 1 if the file exists, 0 otherwise."

  - name: FileOpen
    pure: false
    signature: "FileOpen(Filename: str): int"
    return_type: int
    description: "Opens a text file for reading and returns a file handle."

  - name: FileRead
    pure: false
    signature: "FileRead(Handle: int): str"
    return_type: str
    description: "Reads the next line from an open file."

  - name: FileReset
    pure: false
    signature: "FileReset(Handle: int)"
    return_type: void
    description: "Resets the read position of an open file to the beginning."

  - name: FileSize
    pure: false
    signature: "FileSize(Filename: str): int"
    return_type: int
    description: "Returns the size of a file in bytes."

  - name: Find
    pure: false
    signature: "Find(S: str, Substr: str, Index: int = 1): int"
    return_type: int
    description: "Returns the position of Substr in S starting at Index, or 0."

  - name: FindClose
    pure: false
    signature: "FindClose(Handle: int)"
    return_type: void
    description: "Closes a search handle opened with FindFirst."

  - name: FindCode
    pure: false
    signature: "FindCode(): int"
    return_type: int
    description: "Returns the line index where the [Code] section begins."

  - name: FindFirst
    pure: false
    signature: "FindFirst(Pattern: str, Attributes: int = 0): int"
    return_type: int
    description: "Starts a file search and returns a handle, or a negative value if none found."

  - name: FindGetFileName
    pure: false
    signature: "FindGetFileName(Handle: int): str"
    return_type: str
    description: "Returns the file name found by the current FindFirst/FindNext."

  - name: FindNext
    pure: false
    signature: "FindNext(Handle: int): int"
    return_type: int
    description: "Advances a file search to the next match; returns non-zero on success."

  - name: FindSection
    pure: false
    signature: "FindSection(Section: str): int"
    return_type: int
    description: "Returns the line index of the given section header."

  - name: FindSectionEnd
    pure: false
    signature: "FindSectionEnd(Section: str): int"
    return_type: int
    description: "Returns the line index following the last entry of the given section."

  - name: ForceDirectories
    pure: false
    signature: "ForceDirectories(Dir: str): int"
    return_type: int
    description: "Creates a directory tree at compile time; returns non-zero on success."

  - name: GetDateTimeString
    pure: false
    signature: "GetDateTimeString(Format: str, DateSep: str, TimeSep: str): str"
    return_type: str
    description: "Returns the current date/time formatted according to Format."

  - name: GetEnv
    pure: false
    signature: "GetEnv(Name: str): str"
    return_type: str
    description: "Returns the value of an environment variable."

  - name: GetFileCompanyString
    pure: false
    signature: "GetFileCompanyString(Filename: str): str"
    return_type: str
    description: "Returns the CompanyName string from a file's version information."

  - name: GetFileCopyrightString
    pure: false
    signature: "GetFileCopyrightString(Filename: str): str"
    return_type: str
    description: "Returns the LegalCopyright string from a file's version information."

  - name: GetFileDateTimeString
    pure: false
    signature: "GetFileDateTimeString(Filename: str, Format: str, DateSep: str, TimeSep: str): str"
    return_type: str
    description: "Returns a file's last-modified timestamp formatted according to Format."

  - name: GetFileDescriptionString
    pure: false
    signature: "GetFileDescriptionString(Filename: str): str"
    return_type: str
    description: "Returns the FileDescription string from a file's version information."

  - name: GetFileOriginalFilenameString
    pure: false
    signature: "GetFileOriginalFilenameString(Filename: str): str"
    return_type: str
    description: "Returns the OriginalFilename string from a file's version information."

  - name: GetFileProductVersionString
    pure: false
    signature: "GetFileProductVersionString(Filename: str): str"
    return_type: str
    description: "Returns the ProductVersion string from a file's version information."

  - name: GetFileVersionString
    pure: false
    signature: "GetFileVersionString(Filename: str): str"
    return_type: str
    description: "Returns the file version of an executable or DLL as a dotted string, e.g. <code>1.2.3.4</code>."

  - name: GetMD5OfFile
    pure: false
    signature: "GetMD5OfFile(Filename: str): str"
    return_type: str
    description: "Returns the MD5 hash of a file as a hex string."

  - name: GetMD5OfString
    signature: "GetMD5OfString(S: str): str"
    return_type: str
    description: "Returns the MD5 hash of an ANSI string as a hex string."

  - name: GetMD5OfUnicodeString
    signature: "GetMD5OfUnicodeString(S: str): str"
    return_type: str
    description: "Returns the MD5 hash of a Unicode string as a hex string."

  - name: GetPackedVersion
    pure: false
    signature: "GetPackedVersion(Filename: str): int"
    return_type: int
    description: "Returns the packed (encoded) version number of a file."

  - name: GetSHA1OfFile
    pure: false
    signature: "GetSHA1OfFile(Filename: str): str"
    return_type: str
    description: "Returns the SHA-1 hash of a file as a hex string."

  - name: GetSHA1OfString
    signature: "GetSHA1OfString(S: str): str"
    return_type: str
    description: "Returns the SHA-1 hash of an ANSI string as a hex string."

  - name: GetSHA1OfUnicodeString
    signature: "GetSHA1OfUnicodeString(S: str): str"
    return_type: str
    description: "Returns the SHA-1 hash of a Unicode string as a hex string."

  - name: GetSHA256OfFile
    pure: false
    signature: "GetSHA256OfFile(Filename: str): str"
    return_type: str
    description: "Returns the SHA-256 hash of a file as a hex string."

  - name: GetSHA256OfString
    signature: "GetSHA256OfString(S: str): str"
    return_type: str
    description: "Returns the SHA-256 hash of an ANSI string as a hex string."

  - name: GetSHA256OfUnicodeString
    signature: "GetSHA256OfUnicodeString(S: str): str"
    return_type: str
    description: "Returns the SHA-256 hash of a Unicode string as a hex string."

  - name: GetStringFileInfo
    pure: false
    signature: "GetStringFileInfo(Filename: str, Key: str): str"
    return_type: str
    description: "Returns a string from the version info of a file. Common keys: <code>FileVersion</code>, <code>ProductVersion</code>, <code>CompanyName</code>."

  - name: GetVersionComponents
    pure: false
    signature: "GetVersionComponents(Filename: str, Major: int*, Minor: int*, Revision: int*, Build: int*): int"
    return_type: int
    description: "Reads a file's version components into the referenced variables; returns non-zero on success."

  - name: GetVersionNumbers
    pure: false
    signature: "GetVersionNumbers(Filename: str, VersionMS: int*, VersionLS: int*): int"
    return_type: int
    description: "Reads a file's version into the referenced high/low words; returns non-zero on success."

  - name: GetVersionNumbersString
    pure: false
    signature: "GetVersionNumbersString(Filename: str): str"
    return_type: str
    description: "Returns a file's version as a dotted string, e.g. <code>1.2.3.4</code>."

  - name: Insert
    signature: "Insert(Source: str, S: str*, Index: int)"
    return_type: void
    description: "Inserts Source into S at Index (modifies S by reference)."

  - name: Int
    signature: "Int(Value: any, Default: int = 0): int"
    return_type: int
    description: "Converts a value to integer, using Default when conversion fails."

  - name: Is64BitPEImage
    pure: false
    signature: "Is64BitPEImage(Filename: str): int"
    return_type: int
    description: "Returns non-zero if the given PE image is 64-bit."

  - name: IsWin64
    pure: false
    signature: "IsWin64(): int"
    return_type: int
    description: "Returns non-zero when the compiler is running on 64-bit Windows."

  - name: Len
    signature: "Len(S: str): int"
    return_type: int
    description: "Returns the length of the string."

  - name: LowerCase
    signature: "LowerCase(S: str): str"
    return_type: str
    description: "Returns the string converted to lower case."

  - name: Max
    signature: "Max(A: int, B: int): int"
    return_type: int
    description: "Returns the greater of two integers."

  - name: Message
    pure: false
    signature: "Message(S: str)"
    return_type: void
    description: "Outputs an informational message in the compiler log."

  - name: Min
    signature: "Min(A: int, B: int): int"
    return_type: int
    description: "Returns the smaller of two integers."

  - name: PackVersionComponents
    signature: "PackVersionComponents(Major: int, Minor: int, Revision: int, Build: int): int"
    return_type: int
    description: "Packs version components into a single packed version number."

  - name: PackVersionNumbers
    signature: "PackVersionNumbers(VersionMS: int, VersionLS: int): int"
    return_type: int
    description: "Packs high/low version words into a single packed version number."

  - name: Pos
    signature: "Pos(Substr: str, S: str): int"
    return_type: int
    description: "Returns the 1-based position of Substr in S, or 0 if not found."

  - name: Power
    signature: "Power(Base: int, Exponent: int): int"
    return_type: int
    description: "Returns Base raised to the power of Exponent."

  - name: ReadIni
    pure: false
    signature: "ReadIni(Filename: str, Section: str, Key: str, Default: str = \"\"): str"
    return_type: str
    description: "Reads a value from an INI file at compile time."

  - name: ReadReg
    pure: false
    signature: "ReadReg(RootKey: int, SubKeyName: str, ValueName: str = \"\", Default: str = \"\"): str"
    return_type: str
    description: "Reads a registry value at compile time."

  - name: RemoveBackslashUnlessRoot
    signature: "RemoveBackslashUnlessRoot(S: str): str"
    return_type: str
    description: "Removes a trailing backslash from S unless S is a drive root."

  - name: RemoveFileExt
    signature: "RemoveFileExt(Filename: str): str"
    return_type: str
    description: "Returns Filename with its extension removed."

  - name: RPos
    signature: "RPos(Substr: str, S: str): int"
    return_type: int
    description: "Returns the 1-based position of the last occurrence of Substr in S, or 0."

  - name: SamePackedVersion
    signature: "SamePackedVersion(Version1: int, Version2: int): int"
    return_type: int
    description: "Returns non-zero if two packed version numbers are equal."

  - name: SameStr
    signature: "SameStr(S1: str, S2: str): int"
    return_type: int
    description: "Returns non-zero if two strings are equal (case-insensitive)."

  - name: SameText
    signature: "SameText(S1: str, S2: str): int"
    return_type: int
    description: "Returns non-zero if two strings are equal (case-insensitive)."

  - name: SaveStringToFile
    pure: false
    signature: "SaveStringToFile(Filename: str, S: str, Append: int = 0)"
    return_type: void
    description: "Writes a string to a file, optionally appending."

  - name: SaveToFile
    pure: false
    signature: "SaveToFile(Filename: str)"
    return_type: void
    description: "Writes the preprocessed output collected so far to a file (debugging aid)."

  - name: SetSetupSetting
    pure: false
    signature: "SetSetupSetting(Name: str, Value: str)"
    return_type: void
    description: "Sets a [Setup] section directive at compile time."

  - name: SetupSetting
    pure: false
    signature: "SetupSetting(Name: str): str"
    return_type: str
    description: "Returns the value of a [Setup] section directive by name."

  - name: Str
    signature: "Str(Value: any): str"
    return_type: str
    description: "Converts a value to string. Integers become text, void becomes an empty string."

  - name: StringChange
    signature: "StringChange(S: str*, FromStr: str, ToStr: str): int"
    return_type: int
    description: "Replaces all occurrences of FromStr with ToStr in S; returns the replacement count."

  - name: StrToVersion
    signature: "StrToVersion(S: str): int"
    return_type: int
    description: "Parses a dotted version string into a packed version number."

  - name: Trim
    signature: "Trim(S: str): str"
    return_type: str
    description: "Returns S with leading and trailing whitespace removed."

  - name: TypeOf
    signature: "TypeOf(Ident): int"
    return_type: int
    description: "Returns the type of an identifier: 0=void, 1=int, 2=str."

  - name: UnpackVersionComponents
    signature: "UnpackVersionComponents(Version: int, Major: int*, Minor: int*, Revision: int*, Build: int*)"
    return_type: void
    description: "Splits a packed version number into the referenced components."

  - name: UnpackVersionNumbers
    signature: "UnpackVersionNumbers(Version: int, VersionMS: int*, VersionLS: int*)"
    return_type: void
    description: "Splits a packed version number into the referenced high/low words."

  - name: UpperCase
    signature: "UpperCase(S: str): str"
    return_type: str
    description: "Returns the string converted to upper case."

  - name: VersionToStr
    signature: "VersionToStr(Version: int): str"
    return_type: str
    description: "Converts a packed version number into a dotted version string."

  - name: Warning
    pure: false
    signature: "Warning(Message: str)"
    return_type: void
    description: "Emits a compile-time warning with the given message."

  - name: WriteIni
    pure: false
    signature: "WriteIni(Filename: str, Section: str, Key: str, Value: str)"
    return_type: void
    description: "Writes a value to an INI file at compile time."

  - name: YesNo
    signature: "YesNo(S: str): int"
    return_type: int
    description: "Returns non-zero if the string represents an affirmative (yes/true) value."

# Scope/visibility keywords that may optionally precede the name in a #define or #undef
# (e.g. `#define public Foo 1`). They are highlighted and offered like keywords. The same words are
# also reserved as macro names (see forbidden_variables_name below).
visibility_keywords:
  - name: public
    description: "Declares the macro with public visibility (accessible from including scripts)."
  - name: protected
    description: "Declares the macro with protected visibility."
  - name: private
    description: "Declares the macro with private visibility (local to the current file)."

# Reserved ISPP keywords that must not be used as a #define (or other macro) name.
# Matched case-insensitively against the declared macro name.
# Source: ISPP #define syntax and expression syntax (https://jrsoftware.org/ispphelp/).
#   variable-definition: (define | :) [private | protected | public] <ident> [[<expr>]] [[=] <expr>]
# The scope keywords directly precede <ident> and the type keywords are reserved in expressions.
forbidden_variables_name:
  # Scope/visibility keywords
  - name: public
    description: "Reserved scope keyword in a #define (sets public visibility); cannot be used as a macro name."
  - name: protected
    description: "Reserved scope keyword in a #define (sets protected visibility); cannot be used as a macro name."
  - name: private
    description: "Reserved scope keyword in a #define (sets private visibility); cannot be used as a macro name."
  # Type keywords (ISPP expression types)
  - name: void
    description: "Reserved type keyword (null/void type); cannot be used as a macro name."
  - name: int
    description: "Reserved type keyword (integer type); cannot be used as a macro name."
  - name: str
    description: "Reserved type keyword (string type); cannot be used as a macro name."
  - name: any
    description: "Reserved type keyword (any type); cannot be used as a macro name."
  # Operator keyword
  - name: defined
    description: "Reserved operator keyword (e.g. <code>#if defined(Name)</code>); cannot be used as a macro name."

# Sub-commands of the #pragma directive. 'argument' describes the expected argument:
#   none  - no argument allowed
#   flags - one or more option flags of the form -<letter>(+|-); allowed letters in 'flag_letters'
#   str   - a string expression
#   int   - an integer expression
pragma_sub_commands:
  - name: option
    syntax: "#pragma option -<letter>(+|-) [...]"
    description: "Sets general reading/output options of the preprocessor."
    argument: flags
    flag_letters:
      - letter: c
        description: "Output to compiler."
        default: true
      - letter: e
        description: "Emit empty lines."
        default: true
      - letter: v
        description: "Verbose mode."
        default: false
  - name: parseroption
    syntax: "#pragma parseroption -<letter>(+|-) [...]"
    description: "Sets options that control expression parsing."
    argument: flags
    flag_letters:
      - letter: b
        description: "Short-circuit boolean evaluation."
        default: true
      - letter: m
        description: "Short-circuit multiplication evaluation."
        default: false
      - letter: p
        description: "Pascal-style string literals."
        default: true
      - letter: u
        description: "Allow undeclared identifiers."
        default: false
  - name: message
    syntax: "#pragma message <string-expression>"
    description: "Outputs an informational message to the compiler window."
    argument: str
  - name: warning
    syntax: "#pragma warning <string-expression>"
    description: "Outputs a warning to the compiler window."
    argument: str
  - name: error
    syntax: "#pragma error <string-expression>"
    description: "Displays an error message in a dialog box."
    argument: str
  - name: verboselevel
    syntax: "#pragma verboselevel <integer-expression>"
    description: "Sets the verbosity threshold (0-10) that controls which messages appear."
    argument: int
  - name: inlinestart
    syntax: "#pragma inlinestart <string-expression>"
    description: "Sets the opening delimiter for inline directives (default <code>{#</code>)."
    argument: str
  - name: inlineend
    syntax: "#pragma inlineend <string-expression>"
    description: "Sets the closing delimiter for inline directives (default <code>}</code>)."
    argument: str
  - name: include
    syntax: "#pragma include <string-expression>"
    description: "Sets the semicolon-delimited search paths used for included files."
    argument: str
  - name: spansymbol
    syntax: "#pragma spansymbol <string-expression>"
    description: "Sets the line-continuation character (only the first character is used)."
    argument: str
